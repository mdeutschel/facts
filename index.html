          <dd>Die niedrige Zahl gibt es wirklich, aber sie misst etwas anderes als behauptet. Das Institut der deutschen Wirtschaft (IW) kommt mit einer speziellen Methode (‚statistische Zwillinge') auf rund 2 %; rechnet es mit den gleichen Daten wie das Statistische Bundesamt, landet es selbst bei rund 8 % — nahe an den amtlichen 6 % bereinigt und 16 % unbereinigt. Entscheidend ist aber ein Denkfehler: Der bereinigte Gap rechnet genau die Dinge heraus, die selbst Teil des Problems sind — Teilzeit wegen Care-Arbeit, ‚weibliche' Branchen, unterbrochene Erwerbsbiografien. ‚Bereinigt' heißt also nicht ‚diskriminierungsfrei', sondern ‚nach Abzug der strukturellen Benachteiligung'.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/fuehrung/">Frauen wollen gar keine Führungspositionen übernehmen, weil ihnen die Familie wichtiger ist.</a></dt>
          <dd>Die Daten sprechen gegen den fehlenden Willen: In Deutschland sind nur 29,1 % der Führungskräfte weiblich, klar unter dem EU-Schnitt von 35,2 %, und selbst in den DAX-40-Vorständen stagniert der Anteil zuletzt bei 25,4 %. Der Engpass ist nicht der Wille, sondern die Zeit: 47,4 % der erwerbstätigen Frauen arbeiten in Teilzeit, ganz überwiegend wegen Sorgeverantwortung. Wer den Großteil der unbezahlten Arbeit zu Hause stemmt, kann schlecht gleichzeitig die 60-Stunden-Präsenzkultur einer Vorstandslaufbahn bedienen. Richtig ist: Manche Frauen entscheiden sich bewusst gegen diesen Weg — die Frage ist, ob die Bedingungen eine echte Wahl lassen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gleichberechtigung-erreicht/">Die Gleichberechtigung ist doch längst erreicht, Frauen haben heute genau die gleichen Möglichkeiten wie Männer.</a></dt>
          <dd>Rechtlich stimmt das — und das ist eine echte Errungenschaft. Im Alltag klafft die Lücke aber weiter: Mütter verdienen laut ZEW noch im vierten Jahr nach der ersten Geburt fast 30.000 € weniger als kinderlose Frauen, während Väter keinen solchen Einschnitt erleben. Frauen besitzen im Schnitt rund 30.000 € weniger Vermögen, und ihr Anteil im Bundestag ist 2025 auf 32,4 % gesunken. ‚Gleiche Rechte' und ‚gleiche tatsächliche Möglichkeiten' sind eben nicht dasselbe: Wer von vornherein den Großteil der unbezahlten Arbeit übernimmt, startet nicht von derselben Linie.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/teilzeit/">Männer arbeiten dafür mehr in Vollzeit und machen die harten Überstunden.</a></dt>
          <dd>Bei der bezahlten Erwerbsarbeit stimmt das — Männer leisten im Schnitt mehr Erwerbsstunden. Zählt man aber die unbezahlte Arbeit dazu, dreht sich das Bild: Frauen kommen laut Destatis auf 45:33 Stunden pro Woche, Männer auf 44:23. Die Differenz ist nicht, dass Frauen weniger arbeiten, sondern dass ein großer Teil ihrer Arbeit unsichtbar bleibt — Kinderbetreuung, Pflege, Haushalt. Diese Stunden haben keine Überstundenzuschläge, keinen Renteneintrag und keine Beförderung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/quote/">Eine Frauenquote führt nur dazu, dass unqualifizierte Frauen bevorzugt werden und fähige Männer das Nachsehen haben.</a></dt>
          <dd>Die Sorge vor Bevorzugung ist nachvollziehbar — niemand will nach Geschlecht statt nach Leistung besetzen. Genau deshalb lohnt der Blick auf die Ausgangslage: Frauen stellen 53 % der Hochschulabschlüsse, aber nur 30 % der Professuren und 29,1 % der Führungskräfte. Wenn die Qualifikation da ist, der Aufstieg aber systematisch ausbleibt, ist es unwahrscheinlich, dass es allein an der Eignung liegt. Quoten setzen dort an, wo qualifizierte Frauen übergangen werden. Über das richtige Instrument lässt sich streiten — dass es ein Problem zu lösen gibt, belegen die Zahlen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/pension-gap-arg/">Frauen bekommen weniger Rente, weil sie halt weniger gearbeitet haben — selbst schuld.</a></dt>
          <dd>Frauen haben tatsächlich im Schnitt weniger Beitragsjahre — 33 gegenüber 42 bei Männern. Nur ist das kein Faulheits-, sondern ein Sorgearbeits-Effekt: Die fehlenden neun Jahre stecken großteils in Kinderbetreuung und Pflege, also in Arbeit, die jemand leisten muss. Das Ergebnis sind 955 € statt 1.405 € Altersrente im Monat — 450 € weniger, über 20 Rentenjahre mehr als 100.000 € Differenz. Das Rentensystem koppelt die Absicherung fast vollständig an bezahlte Erwerbsarbeit und lässt unbezahlte Sorgearbeit weitgehend leer ausgehen — ‚selbst schuld' trifft es also nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/child-penalty/">Kinder sind eine freiwillige Entscheidung, dann muss man halt mit den Konsequenzen leben.</a></dt>
          <dd>Dass Elternschaft eine Entscheidung ist, stimmt — aber die Rechnung wird einseitig präsentiert. Laut ZEW verdienen Mütter noch im vierten Jahr nach der ersten Geburt fast 30.000 € weniger als vergleichbare Frauen ohne Kinder; bei Vätern gibt es keinen vergleichbaren Einschnitt. Dieselbe ‚freiwillige Entscheidung' kostet also die Mutter massiv und den Vater kaum etwas. Hinzu kommt: Eine Gesellschaft ganz ohne Nachwuchs hätte bald kein funktionierendes Renten- und Gesundheitssystem mehr. Es geht nicht darum, ob man Kinder bekommt, sondern warum die Kosten fast ausschließlich an einem Geschlecht hängen bleiben.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gewalt-privatsache/">Häusliche Gewalt ist Privatsache, da soll sich der Staat raushalten.</a></dt>
          <dd>Häusliche Gewalt ist rechtlich gerade keine Privatsache, sondern eine Straftat — und sie ist auch kein Randphänomen: 2024 wurden 265.942 Opfer polizeilich erfasst, über 70 % davon Frauen, und 132 Frauen wurden von ihrem Partner oder Ex-Partner getötet. Der Staat hat sich deshalb 2025 mit dem Gewalthilfegesetz ausdrücklich eingemischt: Es schafft erstmals einen bundesweiten, kostenfreien Rechtsanspruch auf Schutz und Beratung. Was hinter der Wohnungstür passiert, hört nicht auf, ein öffentliches Problem zu sein, nur weil es privat geschieht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/dunkelziffer/">Die Zahlen zu häuslicher Gewalt sind doch aufgebauscht — so schlimm kann es nicht sein.</a></dt>
          <dd>Die belastbaren Daten zeigen das Gegenteil: Die polizeilich erfassten Fälle sind eher zu niedrig als zu hoch. Die LeSuBiA-Dunkelfeldstudie des BKA (2026) — eine Befragung von über 15.000 Menschen — kommt auf Anzeigequoten von meist unter 10 %, bei Partnerschaftsgewalt sogar darunter. Fast jede zweite Frau (48,7 %) hat im Lauf ihres Lebens psychische Partnerschaftsgewalt erlebt. Die Gründe fürs Schweigen sind gut dokumentiert: Angst, Scham, emotionale und finanzielle Abhängigkeit. Wer von ‚aufgebauscht' spricht, müsste also erklären, warum so viele Betroffene gerade nicht zur Polizei gehen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/maenner-benachteiligt/">Heutzutage werden eher Männer benachteiligt — im Familienrecht, bei Sorgerecht, überall.</a></dt>
          <dd>Männer haben in einigen Bereichen reale Nachteile, und die gehören ernst genommen: kürzere Lebenserwartung, höhere Suizidrate, oft weniger Zeit mit den Kindern nach Trennungen, und ab 2026 erhalten zunächst nur Männer einen verpflichtenden Wehrdienst-Fragebogen. Auch zeigt die LeSuBiA-Studie, dass Männer von psychischer Partnerschaftsgewalt häufiger betroffen sind als lange angenommen. Das ist aber kein Nullsummenspiel: Diese Probleme heben die systematische Benachteiligung von Frauen bei Einkommen, Rente, Vermögen und körperlicher Sicherheit nicht auf — Frauen tragen bei Gewalt das deutlich höhere Risiko schwerer Verletzungen und Tötung. Beides darf nebeneinander stehen, ohne gegeneinander aufgerechnet zu werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/jungen-bildungsverlierer/">Heute sind doch die Jungen die Bildungsverlierer — wozu noch Frauenförderung, wenn die Mädchen die besseren Abschlüsse machen?</a></dt>
          <dd>Der Befund stimmt und ist ernst zu nehmen: Jungen verlassen die Schule häufiger ohne Abschluss, machen seltener Abitur und haben öfter früh Sprachprobleme — das belegt auch der ‚Gender Education Gap‘ des Statistischen Bundesamts. Mädchen stellen die Mehrheit bei Abitur und Hochschulabschluss. Nur folgt daraus nicht, dass Frauenförderung überflüssig wäre: Trotz besserer Abschlüsse landen Frauen seltener in Führung und verdienen weniger — der Bildungsvorsprung wandelt sich nicht in Einkommen und Macht um. Es ist kein Entweder-oder: Jungen in der Schule zu fördern und Frauen im Beruf zu fördern widerspricht sich nicht, sondern beschreibt zwei verschiedene Engpässe an verschiedenen Stellen im Lebenslauf.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/wehrpflicht/">Echte Gleichberechtigung hieße, dass auch Frauen zum Wehrdienst müssen — die wollen nur die Vorteile, nicht die Pflichten.</a></dt>
          <dd>Der Punkt hat einen berechtigten Kern: Beim neuen Wehrdienst ab 2026 ist das Ausfüllen des Erfassungs-Fragebogens nur für Männer verpflichtend, für Frauen freiwillig — das ist eine echte Ungleichbehandlung. Sie steht aber so im Grundgesetz (Art. 12a), das eine Dienstpflicht bislang nur für Männer vorsieht; eine Änderung bräuchte eine Zwei-Drittel-Mehrheit und ist Gegenstand der laufenden Debatte, nicht von Frauen ‚blockiert‘. Vor allem aber verschiebt die Parole das Thema: Aus ‚Frauen werden bei Lohn, Rente und Sicherheit benachteiligt‘ wird ‚aber beim Wehrdienst haben sie es leichter‘. Beides kann man angehen — die eine Ungleichheit hebt die andere nicht auf. Und gesellschaftliche Pflichtarbeit leisten Frauen längst überproportional: in Pflege und Sorgearbeit.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/feminismus-uebertrieben/">Feminismus ist in Deutschland nicht mehr nötig, das ist doch übertrieben.</a></dt>
          <dd>Wie weit wir gekommen sind, sieht man am besten daran, wie spät die Schritte kamen: Bis 1977 durften Frauen nur mit Erlaubnis des Ehemanns arbeiten, Vergewaltigung in der Ehe war bis 1997 straffrei. Dass das heute undenkbar ist, ist genau das Ergebnis dieser Bewegung — kein Beweis, dass sie überflüssig wurde. Und der Handlungsbedarf ist weiter messbar: erst 2025 schuf das Gewalthilfegesetz einen bundesweiten Rechtsanspruch auf Schutz, der individuelle Anspruch greift sogar erst ab 2032. Ob man das ‚Feminismus‘ nennt oder ‚Gleichstellungspolitik‘, ist Geschmackssache — die offenen Baustellen sind keine.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/tradwife/">Frauen wollen doch selbst zurück an den Herd — der Tradwife-Trend zeigt, dass traditionelle Rollen einfach natürlicher sind.</a></dt>
          <dd>Es stimmt, dass das Hausfrauen-Ideal in sozialen Medien gerade ästhetisch romantisiert wird — als Lebensentwurf wählen es aber nur wenige: Rund 69 % der Mütter minderjähriger Kinder sind erwerbstätig, und Umfragen zeigen, dass nur eine kleine Minderheit der jungen Frauen diese Rolle tatsächlich anstrebt. ‚Natürlich‘ ist daran wenig: Das Modell setzt ein Alleinverdiener-Einkommen voraus und schafft eine finanzielle Abhängigkeit, die sich bei Trennung oder im Alter bitter rächt — genau hier setzen Pension Gap und Altersarmut an. Wer sich frei dafür entscheidet, soll das dürfen. Ein gesellschaftlicher Beleg für ‚natürliche‘ Rollen ist ein Social-Media-Trend aber nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gleiche-bildung/">Frauen sind doch mittlerweile besser gebildet als Männer, dann müssten sie ja auch mehr verdienen.</a></dt>
          <dd>Beim Bildungserfolg liegen Frauen tatsächlich vorn: 53 % der Hochschulabschlüsse und 54 % der Abiturabschlüsse entfallen auf sie. Genau das macht die Lücke danach so aufschlussreich — der Frauenanteil sinkt mit jeder Karrierestufe: 50 % im Master, 45 % bei Promotionen, nur noch 30 % bei Professuren und 29,1 % in Führungspositionen. Diese ‚Leaky Pipeline‘ zeigt, dass nicht die Qualifikation das Problem ist, sondern was danach passiert: Care-Verantwortung, Teilzeitfallen und Aufstiegshürden sorgen dafür, dass aus besseren Abschlüssen keine besseren Gehälter werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/eu-vergleich-arg/">Deutschland steht bei der Gleichberechtigung doch gut da im Vergleich zu anderen Ländern.</a></dt>
          <dd>Im WEF-Ranking 2025 liegt Deutschland auf Platz 9 von 148 — das ist ordentlich, sagt aber wenig über die wirtschaftliche Gleichstellung. Genau dort hakt es: Mit 16 % gehört Deutschland beim Gender Pay Gap zu den Schlusslichtern der EU, deren Durchschnitt auf 11 % gesunken ist; in Belgien sind es nur 1 %. Der gute Gesamtrang entsteht vor allem durch Bildung und Gesundheit, wo Deutschland stark ist. Bei Einkommen und politischer Teilhabe liegt es dagegen hinter den skandinavischen Ländern. Gut dazustehen und ein Problem zu haben, schließt sich also nicht aus.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/bildung/">Bildungssystem Deutschland: PISA, Lehrermangel, Argumente</a></h3>
      <p>Lehrer arbeiten halbtags? Schüler werden dümmer? Antworten zu Bildungsausgaben, PISA-Studie und Lehrkräftemangel mit Quellen aus OECD, KMK und Destatis.</p>
      <p>6 Fakten · 11 Argumente</p>
      <details>
        <summary>Argumente (11)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/weltspitze/">Unser Bildungssystem war mal Weltspitze</a></dt>
          <dd>Deutschland hatte tatsächlich ein international angesehenes Bildungssystem – vor allem in der beruflichen Bildung (duales System). Aber bei PISA 2022 erreichten deutsche 15-Jährige in Mathematik nur noch 475 Punkte – ein historischer Tiefstand und ein Rückgang von 25 Punkten gegenüber 2018. Rund ein Drittel hat in mindestens einem Bereich nur minimale Kompetenzen. Statt sich auf vergangenen Ruhm zu berufen, braucht es massive Investitionen: Deutschland liegt mit 4,5 % des BIP für Bildung deutlich unter dem OECD-Schnitt von 5,1 % und weit hinter Skandinavien (6,5–7,1 %).</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/halbtags/">Die Lehrer arbeiten doch nur halbtags und haben ständig Ferien</a></dt>
          <dd>Eine repräsentative Studie des Prognos-Instituts in Sachsen zeigt: In Schulwochen fallen Mehrstunden an. Im Jahresmittel lagen Vollzeit-Lehrkräfte etwa auf ihrem individuellen Soll, Teilzeitkräfte aber 5,8 % darüber. Unterricht ist dabei nur ein Teil der Arbeitszeit – hinzu kommen Vor- und Nachbereitung, Korrekturen, Elterngespräche, Verwaltung und Konferenzen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/verbloedung/">Schüler können heute nichts mehr, die sind alle verblödet</a></dt>
          <dd>Die PISA-Ergebnisse zeigen tatsächlich einen deutlichen Leistungsrückgang, der aber strukturelle Ursachen hat – und keine individuelle 'Verblödung'. Zu den Ursachen gehören chronische Unterfinanzierung (Deutschland liegt unter dem OECD-Schnitt), akuter Lehrkräftemangel (35.000 fehlend), pandemiebedingte Lernrückstände und der stärkste Zusammenhang zwischen sozialer Herkunft und Bildungserfolg in der OECD. Die Lösung liegt nicht bei den Schüler:innen, sondern beim System: bessere Ausstattung, mehr Personal, gezielte Förderung Benachteiligter.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/laendersache/">Bildung ist Ländersache, da kann man nichts machen</a></dt>
          <dd>Das stimmt verfassungsrechtlich – aber es ist kein Naturgesetz. Das Kooperationsverbot von 2006 verhindert, dass der Bund direkt in Schulen investiert. Das Ergebnis: 16 verschiedene Lehrpläne, massive Qualitätsunterschiede zwischen den Bundesländern und ein 'Bildungsflickenteppich'. Mehrere Bundesländer fordern inzwischen selbst die Aufhebung dieses Verbots. Auch der DigitalPakt Schule zeigt, dass Bund-Länder-Kooperation in der Bildung möglich ist – er wurde trotz Kooperationsverbot realisiert. 'Ländersache' heißt nicht 'unveränderbar'.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/genug-geld/">Wir geben genug Geld für Bildung aus</a></dt>
          <dd>198 Milliarden Euro klingen nach viel. Aber gemessen am BIP gibt Deutschland nur 4,5 % aus — unter dem OECD-Schnitt von 5,1 %. Die Differenz entspricht rund 25 Mrd. Euro pro Jahr oder ~1.600 € mehr pro Schüler/Kitakind. Zum Vergleich: Schweden investiert 7,1 % des BIP. Die Konsequenzen sieht man: marode Schulgebäude, 35.000 fehlende Lehrkräfte und 100.000 fehlende Erzieher.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/hauptschule/">Hauptschüler sind halt einfach nicht so schlau</a></dt>
          <dd>Das ist ein klassischer Zirkelschluss. PISA zeigt seit Jahren, dass Deutschland zu den OECD-Ländern mit stark ausgeprägten sozialen Bildungsungleichheiten gehört. Kinder aus bildungsfernen Familien werden überproportional auf niedrigere Schulformen verteilt. Das spricht nicht für mangelnde Intelligenz, sondern für strukturelle Probleme wie frühe Selektion, ungleiche Förderung und zu wenig Unterstützung benachteiligter Kinder.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/inklusion/">Inklusion schadet normalen Schülern</a></dt>
          <dd>Die umfassendste deutsche Studie zur Inklusion (INSIDE, 2016–2025, über 4.000 Schüler:innen an 246 Schulen) zeigt: Inklusion 'gelingt weder durchweg noch scheitert grundsätzlich'. Entscheidend sind die Rahmenbedingungen – insbesondere gute Kooperation zwischen Regel- und Sonderpädagogen sowie ausreichend Personal. Die Studie zeigt keine generellen Nachteile für Mitschüler:innen ohne Förderbedarf. Problematisch wird es erst, wenn Inklusion ohne zusätzliche Ressourcen umgesetzt wird. Das Problem ist also nicht die Inklusion an sich, sondern ihre unzureichende Ausstattung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/digitalisierung/">Digitalisierung an Schulen bringt nichts, Kinder sollen lesen lernen</a></dt>
          <dd>Digitale Kompetenz und Lesen lernen sind kein Widerspruch – beides gehört zu den Grundkompetenzen des 21. Jahrhunderts. Der DigitalPakt Schule hat Milliarden in Infrastruktur gebunden. Das Problem war nie 'ob', sondern 'wie': Tablets allein verbessern keinen Unterricht. Es braucht pädagogische Konzepte, geschulte Lehrkräfte und IT-Support. Seit 2025 liegt bereits ein Zwischenbericht zur Evaluation vor; der DigitalPakt 2.0 soll stärker auf Qualität statt nur auf Hardware setzen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/homeschooling-freiheit/">Homeschooling gibt Eltern endlich Freiheit – Schulpflicht ist überholt.</a></dt>
          <dd>Elternrechte sind wichtig. Gleichzeitig soll die Schulpflicht gleiche Bildungschancen, soziale Teilhabe und Kinderschutz sichern – gerade auch für Kinder, die zuhause wenig Unterstützung haben. Deshalb ist Homeschooling in Deutschland nur in engen Ausnahmefällen möglich. Mehr Elternmitwirkung in Schule ist sinnvoll, ein genereller Ersatz der Schulpflicht aber nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/gymnasium-25-prozent/">Nur die besten 25 Prozent sollten aufs Gymnasium.</a></dt>
          <dd>Leistungsorientierung ist legitim, aber starre Quoten sind bildungspolitisch riskant. Lernverläufe entwickeln sich unterschiedlich, und frühe harte Selektion verschärft oft die Abhängigkeit vom Elternhaus. Sinnvoller sind klare Standards, gute Diagnostik und durchlässige Bildungswege, damit Spätentwickler nicht dauerhaft aussortiert werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/schule-ideologiefrei/">Schule muss endlich ideologiefrei werden.</a></dt>
          <dd>Schule darf keine Parteipropaganda machen – da stimmt der Kern. ‚Ideologiefrei‘ heißt aber nicht wertfrei: Demokratie, Grundrechte, Gleichberechtigung, Nationalsozialismus, Diskriminierung und Medienkompetenz gehören zum Bildungsauftrag. Entscheidend ist, Themen plural und altersgerecht zu behandeln statt parteipolitisch zu rahmen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gesundheit/">Gesundheitssystem Deutschland: Kosten, Pflege, Argumente</a></h3>
      <p>Bestes System der Welt? Bald pleite? Antworten zu Beitragssatz, Zwei-Klassen-Medizin, Pflegenotstand und ePA mit Quellen aus GKV-SV, BMG und OECD.</p>
      <p>12 Fakten · 14 Argumente</p>
      <details>
        <summary>Argumente (14)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/bestes-system/">Wir haben das beste Gesundheitssystem der Welt</a></dt>
          <dd>Deutschland hat echte Stärken: universelle Absicherung, kurze Wartezeiten für Notfallversorgung und schnellen Zugang zu neuen Medikamenten. Gleichzeitig belegen Daten erhebliche Zugangsunterschiede zwischen GKV und PKV, einen akuten Pflegenotstand, strukturelle Überkapazitäten im Krankenhausbereich und einen der niedrigsten Präventionsanteile im OECD-Vergleich. 'Bestes System der Welt' ist daher eine pauschale Übertreibung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/beitraege-hoch/">Die Krankenkassenbeiträge sind viel zu hoch</a></dt>
          <dd>Der GKV-Gesamtbeitrag liegt 2026 rechnerisch bei 17,5 % des Bruttogehalts (tatsächlich erheben die Kassen im Schnitt etwas mehr, rund 17,7 %) und wird paritätisch geteilt, der Arbeitnehmer-Anteil beträgt also knapp 8,9 %. Zum Vergleich: In Frankreich liegt der Arbeitnehmer-Anteil bei rund 7 %, in den Niederlanden bei ca. 5,5 % – der deutsche Wert ist also hoch, aber kein extremer Ausreißer im OECD-Vergleich. Das eigentliche Problem ist weniger die Höhe als die Effizienz: Deutschland gibt sehr viel aus, hat strukturelle Überkapazitäten im Krankenhausbereich und investiert vergleichsweise wenig in Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/jeder-versorgt/">Jeder bekommt in Deutschland die medizinische Versorgung, die er braucht</a></dt>
          <dd>Der Anspruch ist breit — Deutschland hat eine der umfassendsten Pflichtabsicherungen weltweit, niemand bleibt formal ohne Versorgung. In der Praxis gibt es aber spürbare Lücken: Viele gesetzlich Versicherte berichten über lange Wartezeiten auf Facharzttermine, hinzu kommen Engpässe in Pflege und psychischer Versorgung sowie deutliche Unterschiede zwischen Stadt und Land.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/auslaender-gesundheit/">Ausländer belasten unser Gesundheitssystem</a></dt>
          <dd>Es kommt auf die Gruppe an: Erwerbsmigrant:innen sowie EU-Bürger:innen zahlen Beiträge wie alle anderen GKV-Mitglieder auch – und nehmen statistisch im Schnitt weniger Leistungen in Anspruch als die ältere inländische Bevölkerung, weil sie jünger und erwerbstätig sind. Für Asylsuchende gilt zunächst nur ein eingeschränkter Leistungsumfang (AsylbLG: akute Erkrankungen, Schmerzen, Schwangerschaft, Impfungen); erst nach 36 Monaten ist der Leistungsumfang deutlich erweitert. Punktuelle Mehrkosten bei der Erstversorgung Asylsuchender gibt es — sie tragen aber überwiegend Kommunen und Länder, nicht die GKV. Die Haupttreiber der Finanzierungsprobleme sind strukturell: steigende Ausgaben durch die alternde Bevölkerung, Überkapazitäten im Krankenhausbereich und zu wenig Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/psychisch-einbildung/">Psychische Krankheiten sind nur Einbildung / Modeerscheinung</a></dt>
          <dd>Psychische Erkrankungen sind medizinisch genauso real wie körperliche – das ist wissenschaftlicher Konsens. Ein Teil des statistischen Anstiegs erklärt sich durch breiteres Bewusstsein und erweiterte Diagnosekriterien; die zugrundeliegenden Erkrankungen sind dadurch aber nicht weniger behandlungsbedürftig. Im ersten Halbjahr 2025 stiegen die Fallzahlen in Psychotherapie und Psychiatrie weiter um 3,4 %, in der Kinder- und Jugendpsychiatrie sogar um 5,7 %. Die Versorgung hinkt dem Bedarf seit Jahren hinterher.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/homoeopathie/">Homöopathie/Alternativmedizin sollte von der Kasse bezahlt werden</a></dt>
          <dd>Für Homöopathie gibt es keine robuste, reproduzierbare Evidenz eines Nutzens über Placebo hinaus. Der Gesetzgeber hat 2023 mit dem GKV-Finanzstabilisierungsgesetz die Möglichkeit der Krankenkassen gestrichen, Homöopathie als freiwillige Satzungsleistung zu erstatten – begründet mit dem fehlenden Nachweis des Nutzens. In einem System mit konkreten Engpässen bei Pflege, Psychotherapie und Prävention ist die Mittelverwendung nach Evidenz ein nachvollziehbares Prinzip.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/zu-viele-krankenhaeuser/">Es gibt zu viele Krankenhäuser</a></dt>
          <dd>Da ist tatsächlich etwas dran: Deutschland hat viele Krankenhausbetten und eine vergleichsweise niedrige Bettenauslastung. Aber 'weniger' heißt nicht automatisch 'besser'. Es braucht Spezialisierung, Vernetzung und gleichzeitig Erreichbarkeit – besonders in ländlichen Regionen. Genau diesen Spagat versucht die Krankenhausreform.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/pharma/">Die Pharmaindustrie macht uns absichtlich krank</a></dt>
          <dd>Arzneimittel unterliegen in der EU einem regulierten Zulassungs- und Bewertungsverfahren. Berechtigte Kritik betrifft eher Preise, Transparenz und Fehlanreize als eine belegte Absicht, Menschen krank zu machen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/aerztemangel-landleben/">Auf dem Land gibt es keine Ärzte mehr</a></dt>
          <dd>Der Kern stimmt für bestimmte Regionen: 33 Planungsbereiche gelten offiziell als unterversorgt, weitere 152 sind gefährdet – überwiegend im ländlichen Raum und vor allem bei Hausärzten. Deutschlandweit ist die absolute Ärztezahl aber mit 191.875 Ärztinnen und Ärzten in der vertragsärztlichen Versorgung 2025 ein Rekordhoch. Das Problem ist die ungleiche Verteilung: Zwischen dem am besten und am schlechtesten versorgten Landkreis liegt ein Faktor 4 bei der Ärztedichte.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/medikamente-zu-teuer/">Medikamente in Deutschland sind viel zu teuer</a></dt>
          <dd>Das stimmt für patentgeschützte Neueinführungen – hier sind die Preise im ersten Jahr ohne Deckelung frei wählbar. AMNOG regelt danach einen Rabatt, hat aber den Ausgabenanstieg nicht gestoppt: 59,3 Mrd. € GKV-Arzneimittelausgaben 2024 (+9 %). 54 % der Kosten entfallen auf 7 % der Verordnungen. Im Patentmarkt hat sich der Durchschnittspreis pro Packung von 4.100 € (2015) auf 7.700 € (2024) fast verdoppelt. Das Gegenargument der Industrie – hohe Preise seien nötig, um Forschungs- und Entwicklungskosten zu finanzieren – ist nicht grundsätzlich falsch, erklärt aber nicht alle Preisunterschiede zwischen Ländern.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/digitalisierung-rueckstand/">Deutschland ist beim digitalen Gesundheitssystem hoffnungslos rückständig</a></dt>
          <dd>Der Rückstand war real: Die ePA startete mehrfach verzögert. Seit Februar 2025 haben 73 Millionen Versicherte automatisch eine ePA (Opt-out). Das ist ein echter Systemwechsel, wenn auch spät. Bei digitalen Gesundheitsanwendungen (DiGA) ist Deutschland mit 58 zugelassenen Apps (Ende 2025) und schnellen Erstattungswegen internationaler Vorreiter – allerdings bei unklarem Kosten-Nutzen-Verhältnis. Fortschritt und Rückstand existieren gleichzeitig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/gkv-pleite/">Die GKV ist bald pleite / Das System ist nicht mehr finanzierbar</a></dt>
          <dd>Die Sorge ist nachvollziehbar: Die GKV-Ausgaben wuchsen 2025 um 7,8 % — mehr als doppelt so schnell wie die Einnahmen — und die Finanzreserven liegen unter der gesetzlich vorgeschriebenen Mindestschwelle. Dass die Kassen 2025 trotzdem einen kleinen Überschuss auswiesen, lag allein an kräftig erhöhten Zusatzbeiträgen; der Gesundheitsfonds selbst blieb im Defizit. ‚Pleite‘ ist aber nicht das Szenario: Die GKV ist eine Pflichtversicherung, deren Defizite über Beiträge und Bundeszuschuss ausgeglichen werden. Verschärfend wirkt, dass der Bund seinen Zuschuss ab 2027 sogar kürzt. Das strukturelle Problem ist das Ausgabenwachstum — vor allem durch teure Arzneimittel-Innovationen und die alternde Bevölkerung —, nicht eine drohende Zahlungsunfähigkeit.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/krankenstand-blaumachen/">Die Deutschen sind Weltmeister im Krankfeiern — kein Wunder, dass die Wirtschaft lahmt</a></dt>
          <dd>Richtig ist: Deutsche Beschäftigte melden sich mit über 20 Krankheitstagen im Jahr deutlich häufiger krank als der EU-Schnitt (rund 8 Tage), und die Lohnfortzahlung kostet Arbeitgeber laut IW rund 76,7 Mrd. Euro. Ein großer Teil des jüngsten Anstiegs ist aber ein Messeffekt: Seit der elektronischen Arbeitsunfähigkeitsmeldung (2022/2023) werden Fälle lückenlos erfasst, die früher gar nicht in der Statistik auftauchten. ‚Krankfeiern‘ unterstellt zudem Absicht, wo Atemwegswellen, eine alternde Belegschaft und psychische Erkrankungen die Hauptursachen sind. Ob ein unbezahlter Karenztag hilft, ist offen — er kann Präsentismus fördern, also krankes Erscheinen, das Infektionen verbreitet und langfristig teurer wird.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/buergerversicherung-loest-alles/">Wenn Privatversicherte und Beamte auch einzahlen würden, wären die Finanzprobleme der Kassen gelöst</a></dt>
          <dd>Eine Bürgerversicherung würde die Finanzierung gerechter verteilen — das ist ein ernstzunehmendes Argument: Knapp 8,79 Mio. PKV-Vollversicherte (rund 10,6 % der Bevölkerung) stehen etwa 74,5 Mio. GKV-Versicherten gegenüber, und gerade gut verdienende, gesunde Menschen fehlen dem Solidarsystem. ‚Alle Probleme gelöst‘ ist aber zu viel versprochen: Das strukturelle Grundproblem der GKV ist nicht die Einnahmebasis allein, sondern dass die Ausgaben — alternde Bevölkerung, teure Innovationen — dauerhaft schneller wachsen als jede Einnahmequelle. Hinzu kommt: Auch Privatversicherte verursachen im Alter hohe Kosten, und der Übergang wäre rechtlich wie finanziell komplex. Mehr Beitragszahler verschaffen Luft — die Kostendynamik bremsen sie nicht.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gendern/">Gendern: Argumente, Umfragen &amp; Sprachforschung — Faktencheck</a></h3>
      <p>Lehnt die Mehrheit Gendern ab? Macht es Texte unlesbar? 10 Streitpunkte mit Daten aus Allensbach und Sprachforschung — belegt und nachprüfbar.</p>
      <p>8 Fakten · 10 Argumente</p>
      <details>
        <summary>Argumente (10)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-zerstoert-sprache/">Das Gendern zerstört die deutsche Sprache!</a></dt>
          <dd>Die Sorge um die Sprachqualität ist nachvollziehbar — tatsächlich kritisiert auch der Rechtschreibrat die grammatischen Folgeprobleme von Sonderzeichen. Allerdings war die deutsche Sprache immer im Wandel: 1972 wurde ‚Fräulein' in Behörden abgeschafft, seit 1980 sind geschlechtsneutrale Stellenanzeigen Pflicht. Die Beidnennung ist seit Jahrzehnten etabliert und wird von 69 % akzeptiert. Die Debatte betrifft primär neuere Kurzformen wie den Genderstern — nicht geschlechtergerechte Sprache insgesamt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/mehrheit-lehnt-ab/">Eine Mehrheit lehnt Gendern ab!</a></dt>
          <dd>Das stimmt für Gendern mit Sonderzeichen: Laut Forsa (2023) stört es 73 % der Bevölkerung. Allerdings ist das Bild differenzierter: Unter den 18- bis 29-Jährigen befürworten 42 % den Genderstern, und die Doppelnennung wird von 69 % akzeptiert (Infratest dimap/WDR 2022). Die Ablehnung richtet sich vor allem gegen Sonderzeichen im Wortinnern — nicht gegen geschlechtergerechte Sprache an sich. Zudem sprechen sich 46 % gegen ein Genderverbot in Verwaltungstexten aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/nur-modeerscheinung/">Gendern ist nur eine Modeerscheinung!</a></dt>
          <dd>Der Eindruck ist verständlich, weil Sonderzeichen wie der Genderstern erst seit wenigen Jahren verbreitet sind. Geschlechtergerechte Sprache wird jedoch seit den späten 1970ern wissenschaftlich diskutiert — Senta Trömel-Plötz veröffentlichte 1978 den ersten Aufsatz dazu. Seit 1980 sind geschlechtsneutrale Stellenausschreibungen gesetzlich vorgeschrieben, seit 1986 formuliert Hessen Gesetze ohne generisches Maskulinum. Die konkrete Form ändert sich, aber das Grundanliegen besteht seit über 45 Jahren.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/sprache-aendert-nichts/">Sprache ändert doch nichts an der Realität!</a></dt>
          <dd>Die Intuition ist nachvollziehbar — aber die Forschung zeigt messbare Effekte. Eine Multi-Lab-Studie mit 2.697 Teilnehmenden an 12 Laboren (Brohmer et al. 2024) bestätigte: Bei geschlechterinklusiven Formen nennen Versuchspersonen signifikant mehr Frauen. Kinder trauen sich bei Beidnennung typisch männliche Berufe eher zu (Vervecken &amp; Hannover 2015). Allerdings sind die meisten Befunde Laborergebnisse — ob und wie stark sie sich im Alltag auswirken, ist wissenschaftlich nicht abschließend geklärt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/generisches-maskulinum-reicht/">Das generische Maskulinum meint doch alle!</a></dt>
          <dd>Grammatisch ist das korrekt — das generische Maskulinum soll per Konvention alle Geschlechter umfassen. Die Sprachpsychologie zeigt jedoch, dass es nicht von allen so wahrgenommen wird: In Studien denken Versuchspersonen beim generischen Maskulinum überwiegend an Männer. Die Uni Würzburg (Rothermund &amp; Strack 2024) fand, dass selbst ein expliziter Hinweis auf die geschlechtsübergreifende Bedeutung den Male Bias nicht beseitigt. Das generische Maskulinum funktioniert grammatisch, aber nicht immer kognitiv.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-unlesbar/">Gendern macht Texte unlesbar!</a></dt>
          <dd>Die subjektive Wahrnehmung ist verbreitet, wird aber von der Verständlichkeitsforschung nicht gestützt. Die TU Braunschweig (Friedrich &amp; Heise 2019) testete vier Versionen eines Vertrags an 355 Personen: kein messbarer Verständlichkeitsunterschied. Blake &amp; Klimmt (2010) fanden auch bei Nachrichtentexten keine Beeinträchtigung. Allerdings gibt es berechtigte Barrierefreiheitsbedenken: Der DBSV rät von Doppelpunkt und Unterstrich ab, da Screenreader sie problematisch verarbeiten. Die Verständlichkeit hängt weniger am Gendern als an der gewählten Form.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/uni-genderzwang/">An den Unis wird man zum Gendern gezwungen!</a></dt>
          <dd>Mindestens 50 deutsche Hochschulen haben Sprachleitfäden — diese sind allerdings Empfehlungen, keine Vorschriften. Der Rechtschreibrat hat 2023 darauf hingewiesen, dass es strittig sei, ob Hochschulen vom amtlichen Regelwerk abweichen dürfen. In Bayern gilt seit April 2024 ein Genderverbot auch an Hochschulen, mit Ausnahme der geschützten Freiheit von Forschung und Lehre. Es gibt also Empfehlungen, selten echten Druck, und zunehmend auch explizite Verbote.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gegen-rechtschreibung/">Gendern ist gegen die Regeln der deutschen Rechtschreibung!</a></dt>
          <dd>Für Sonderzeichen wie Genderstern und Doppelpunkt trifft das im Kern zu: Der Rat für deutsche Rechtschreibung hat 2023 festgestellt, dass sie ‚nicht zum Kernbestand der deutschen Orthografie' gehören. Das gilt allerdings nicht für alle Formen — die Beidnennung und geschlechtsneutrale Formulierungen sind vollständig regelkonform. Der Rechtschreibrat beobachtet die Entwicklung bewusst weiter und schließt eine spätere Aufnahme nicht aus — er sieht sie aber ‚derzeit nicht wissenschaftlich eindeutig zu begründen'.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/andere-sprachen-ohne/">Andere Sprachen kommen auch ohne Gendern aus!</a></dt>
          <dd>Das trifft auf manche Sprachen zu — Finnisch und Türkisch etwa kennen kein grammatisches Geschlecht. Allerdings zeigen Studien, dass selbst dort ein Male Bias bei geschlechtsneutralen Pronomen besteht. Und in vielen Sprachen mit Genussystem gibt es parallele Debatten: In Frankreich hat der Senat écriture inclusive 2023 mit 221:82 verboten, in Schweden wurde ‚hen' 2015 offiziell eingeführt, im Englischen ist das singuläre ‚they' seit 2019 im Merriam-Webster. Das Anliegen ist international — die Lösungen fallen je nach Sprachstruktur verschieden aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/sprachpolizei/">Gendern ist Sprachpolizei und Bevormundung!</a></dt>
          <dd>Die Sorge vor Sprachkontrolle ist demokratisch berechtigt. Tatsächlich gibt es weder ein Bundesgesetz noch eine Pflicht zum Gendern — 75 % lehnen eine solche laut Forsa auch ab. Umgekehrt haben mehrere Bundesländer Gendern in Schulen und Verwaltung verboten — also eher ein Sprechverbot als ein Sprechgebot. Kommunale Leitfäden wie in Hannover oder Bremen sind Empfehlungen, keine Vorschriften. Die Lage ist paradox: Es wird sowohl ein angeblicher Genderzwang als auch ein tatsächliches Genderverbot kritisiert.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/">KI &amp; Arbeitsmarkt: Welche Jobs sind in Gefahr? Fakten 2026</a></h3>
      <p>Vernichtet KI die Hälfte aller Jobs? Verschläft Deutschland die Revolution? Antworten zu Automatisierung, Berufen und Weiterbildung — Quellen IAB, OECD.</p>
      <p>8 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/ki-vernichtet-jobs/">KI wird die Hälfte aller Jobs vernichten!</a></dt>
          <dd>Die Angst ist verständlich, aber die Forschung zeichnet ein anderes Bild. Laut IAB fällt der Nettoeffekt von KI auf die Gesamtbeschäftigung in Deutschland nahezu neutral aus — es werden etwa so viele Arbeitsplätze geschaffen wie abgebaut. Allerdings müssen bis zu 3 Millionen Menschen den Beruf wechseln. Das Problem ist weniger Massenarbeitslosigkeit als ein massiver Umschulungsbedarf.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/bueroarbeit-ueberfluessig/">In ein paar Jahren braucht man keine Bürojobs mehr!</a></dt>
          <dd>Büro- und Verwaltungstätigkeiten sind tatsächlich am stärksten betroffen — 54 % der geschätzten Jobwechsel entfallen auf diesen Bereich. Aber ‚betroffen' heißt nicht ‚überflüssig': BCG-Berater mit KI-Zugang lieferten 40 % bessere Qualität, was zeigt, dass KI eher ein Werkzeug als ein Ersatz ist. Die Aufgabenprofile werden sich verändern, die Funktionen bleiben.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/deutschland-verschlaeft/">Deutschland verschläft die KI-Revolution!</a></dt>
          <dd>Das Bild ist differenzierter: Deutschland liegt auf Platz 7 im globalen KI-Index, hält Platz 5 bei KI-Patenten und hat 935 aktive KI-Startups. Die echte Schwäche liegt im Risikokapital (12-mal weniger pro Kopf als die USA) und der langsamen KI-Adoption in traditionellen Industrien. Deutschland hat die Forschung, aber nicht die Skalierung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/nur-einfache-taetigkeiten/">KI betrifft nur einfache Tätigkeiten!</a></dt>
          <dd>Das Gegenteil ist der Fall: Die stärkste Zunahme der Automatisierbarkeit zeigt sich bei Expertenberufen (+9,7 Prozentpunkte). Betriebswirte, Softwareentwickler und Journalisten erleben Sprünge von 20 bis 30 Prozentpunkten. Der absolute Wert bleibt bei Fachkraftberufen am höchsten (62 %), aber der Trend zeigt klar: Generative KI trifft zunehmend die Wissensarbeit.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/nur-produktiver/">KI macht nur produktiver, niemand verliert seinen Job!</a></dt>
          <dd>Produktivitätsgewinne sind real — bis zu 14 % im Kundenservice, 40 % bessere Qualität in der Beratung. Aber 27 % der deutschen Unternehmen erwarten in den nächsten fünf Jahren Stellenabbau durch KI, und das IAB rechnet mit 1,6 Millionen umgeschichteten Arbeitsplätzen. Produktivität und Jobabbau schließen sich nicht gegenseitig aus — sie passieren gleichzeitig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/politik-tut-nichts/">Die Politik tut nichts für Weiterbildung!</a></dt>
          <dd>Es gibt durchaus Programme: das Qualifizierungschancengesetz, die Nationale Weiterbildungsstrategie, über 5 Milliarden Euro für die KI-Strategie. Das Problem ist die Reichweite: Nur 20 % der Beschäftigten erhalten KI-Schulungen, Hilfsarbeitskräfte haben eine 9,5-mal niedrigere Weiterbildungsquote als Akademiker. Die Instrumente existieren — sie erreichen aber systematisch die Falschen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/kreative-arbeit-weg/">KI nimmt den Kreativen die Arbeit weg!</a></dt>
          <dd>Kreativberufe sind tatsächlich stark betroffen: Modedesigner (+38 PP), Journalisten (+20 PP), Komponisten erstmals automatisierbar (von 0 auf 25 %). Der Synchronsprecher ist der einzige Beruf mit 100 % Substituierbarkeit. Aber in der Breite zeigt sich eher eine Verschiebung hin zur Mensch-KI-Kollaboration als eine vollständige Ersetzung — kreative Gesamtkonzepte sind bisher kaum automatisierbar.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/china-usa-voraus/">China und die USA sind uns bei KI meilenweit voraus!</a></dt>
          <dd>Bei Investitionen stimmt das: Die USA investieren mit 109 Milliarden Dollar 55-mal mehr als Deutschland. Bei Patenten dominiert China mit 25.177 gegenüber 436. Aber Deutschland ist Europas Nr. 1 bei KI-Patenten, hat eine wachsende Startup-Szene (+36 %) und weltweit anerkannte Forschung. Die Lücke liegt weniger in der Kompetenz als in der Skalierung und im Risikokapital.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/grundeinkommen-noetig/">Wir brauchen wegen KI ein bedingungsloses Grundeinkommen!</a></dt>
          <dd>Die Debatte ist legitim, aber die aktuelle Forschungslage stützt sie nicht unmittelbar: Das IAB erwartet keinen Netto-Jobabbau, und historisch haben technologische Umbrüche Arbeit transformiert statt eliminiert. Der dringendere Bedarf liegt bei gezielter Qualifizierung und sozialer Absicherung während des Übergangs. Ob KI langfristig ein Grundeinkommen nötig macht, hängt von Geschwindigkeit und Tiefe des Wandels ab — das ist heute noch offen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/">Fachkräftemangel: Mythos oder Realität? Die Fakten 2026</a></h3>
      <p>Gibt es den Fachkräftemangel wirklich oder zahlen Firmen nur zu wenig? Fakten zu Fachkräftelücke, Babyboomern, Löhnen, Zuwanderung &amp; KI — Quellen IW/KOFA, IAB, Destatis, BA.</p>
      <p>8 Fakten · 10 Argumente</p>
      <details>
        <summary>Argumente (10)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/kein-mangel-nur-lohn/">Einen Fachkräftemangel gibt es gar nicht — die Firmen wollen nur nicht anständig zahlen!</a></dt>
          <dd>Bei einfachen Tätigkeiten steckt ein wahrer Kern darin: Wo viele Arbeitslose auf wenige Stellen kommen, wären höhere Löhne tatsächlich ein wirksamer Hebel — auf eine Helferstelle kamen 2022 mehr als fünf Arbeitslose. Bei qualifizierten Fachkräften ist es umgekehrt: Dort fehlten rechnerisch 371.000 bis 630.000 Menschen (2022), und in der gut bezahlten Pflege bleibt die Lücke trotz überdurchschnittlicher Löhne groß. Geld allein schafft keine zusätzlich ausgebildeten Fachkräfte. Der Mangel ist also echt — aber gezielt, nicht flächendeckend.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/genug-arbeitslose/">Wir haben doch genug Arbeitslose, die sollen mal arbeiten!</a></dt>
          <dd>Es stimmt, dass gleichzeitig Millionen Menschen arbeitslos sind und Stellen offen bleiben — das wirkt paradox. Der Grund ist ein Passungsproblem: Laut Bundesagentur für Arbeit suchte nur rund ein Viertel der arbeitslosen Fachkräfte überhaupt in einem Engpassberuf. Wer als Helfer ohne Abschluss gemeldet ist, kann eine offene Stelle für examinierte Pflegekräfte oder Elektriker nicht einfach besetzen. Es fehlt also nicht der Wille, sondern die passende Qualifikation am passenden Ort — deshalb hilft Qualifizierung mehr als Vorwürfe.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/vorwand-fuer-zuwanderung/">Der Fachkräftemangel ist nur ein Vorwand, um billige Ausländer ins Land zu holen!</a></dt>
          <dd>Die Zahlen sprechen gegen einen erfundenen Vorwand: Die Fachkräftelücke lag 2025 bei rund 370.000 Stellen, Engpässe gibt es in 163 Berufen, und die nicht ausgeschöpfte Wertschöpfung beziffert das IW Köln auf 49 Milliarden Euro. Dass ausländische Beschäftigte den Beschäftigungsaufbau tragen (von 2015 bis 2024 plus 2,7 Millionen), ist eine Folge des Mangels, nicht sein Zweck. Und ‚billig' trifft es nicht: In der Pflege etwa liegen die Löhne über dem Durchschnitt. Hinter dem Mangel steht die Demografie — bis 2039 gehen 13,4 Millionen Menschen in Rente.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/alle-vollzeit/">Wenn alle Vollzeit arbeiten würden, bräuchten wir keine Zuwanderung!</a></dt>
          <dd>Die inländischen Reserven sind tatsächlich groß: Würden mehr Teilzeitkräfte aufstocken und weitere Gruppen stärker mitarbeiten, ließen sich modellhaft bis zu rund 4,3 Millionen Vollzeitäquivalente heben. Das ist viel — aber es steht gegen einen demografischen Rückgang von 7,2 Millionen Erwerbspersonen allein bis 2035. Hinzu kommt: Teilzeit lässt sich nicht per Dekret abschaffen, sie hängt an Kinderbetreuung und Pflege. Realistisch braucht es beides — mehr inländische Beteiligung und Zuwanderung —, nicht ein Entweder-oder.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/babyboomer-kollaps/">Die Babyboomer gehen in Rente — dann bricht alles zusammen.</a></dt>
          <dd>Die Sorge hat eine reale Grundlage: Bis 2039 erreichen 13,4 Millionen Erwerbspersonen das Rentenalter, und 2026 sinkt das Erwerbspersonenpotenzial erstmals demografiebedingt. Das ist der härteste Kern des Fachkräftemangels. ‚Alles bricht zusammen' überzeichnet aber: Höhere Erwerbsbeteiligung Älterer (die Quote der 60- bis 64-Jährigen stieg bereits von 53 auf 68 %), Zuwanderung und Produktivitätsgewinne federn den Rückgang ab. Es droht kein Kollaps, aber ein langer, spürbarer Anpassungsdruck.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/nur-akademiker-gejammer/">Fachkräftemangel betrifft nur Akademiker — und die Wirtschaft jammert sowieso nur.</a></dt>
          <dd>Dass Interessenverbände gern dramatisieren, ist ein berechtigter Verdacht — hier deckt sich die Klage aber mit unabhängigen Daten. Und der Mangel trifft vor allem die praktischen Ausbildungsberufe, nicht die Hörsäle: 61 % der Fachkräftelücke entfallen auf Menschen mit abgeschlossener Berufsausbildung, die größten Engpässe liegen in Bauelektrik, Alten- und Krankenpflege, Erziehung und Kfz-Technik. Akademische Berufe sind am wenigsten betroffen. Dass es nicht bloß Gejammer ist, zeigt der reale Schaden: Das Institut der deutschen Wirtschaft (IW) beziffert die 2024 nicht ausgeschöpfte Produktion auf 49 Milliarden Euro.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/zuwanderung-loest-alles/">Zuwanderung löst den Fachkräftemangel.</a></dt>
          <dd>Zuwanderung ist notwendig — ohne sie würde die Beschäftigung längst schrumpfen, und es braucht jährlich grob 290.000 bis 370.000 Arbeitskräfte von außen. Aber sie löst das Problem nicht im Alleingang. Entscheidend ist, dass die Qualifikationen zu den Engpässen passen: Die Anerkennung ausländischer Abschlüsse bleibt durch Bürokratie und föderale Zuständigkeiten ein Nadelöhr. Zuwanderung wirkt nur als ein Baustein neben Qualifizierung, höherer Erwerbsbeteiligung und besserer Ausbildung — nicht als alleinige Lösung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/ki-macht-ueberfluessig/">KI und Roboter machen den ganzen Fachkräftemangel sowieso überflüssig.</a></dt>
          <dd>KI wird die Arbeitswelt verändern und kann produktiver machen — gegen den Fachkräftemangel hilft sie aber ausgerechnet dort am wenigsten, wo er am größten ist. Pflege, Erziehung und Sozialarbeit haben mit 13 bis 27 % das niedrigste Automatisierungspotenzial; das Institut für Arbeitsmarkt- und Berufsforschung (IAB) warnt ausdrücklich davor, die Entlastung durch KI ‚zu überschätzen'. Bei IT-Berufen könnte der Engpass durch steigende KI-Nachfrage sogar zunehmen. Realistisch bringt KI moderate Produktivitätsgewinne (rund 1 % pro Jahr), aber keinen Ersatz für Millionen fehlende Kräfte.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/genug-ausbildung/">Wir bilden doch genug aus — das Problem ist hausgemacht.</a></dt>
          <dd>An der Diagnose ist etwas dran: Es ist tatsächlich auch ein hausgemachtes Passungsproblem. Zum Stichtag 30.09.2024 blieben 69.400 Ausbildungsstellen unbesetzt, während gleichzeitig 70.400 Bewerber unversorgt waren — Angebot und Nachfrage finden regional und fachlich nicht zusammen. Hinzu kommt, dass 19 % der jungen Erwachsenen keinen Berufsabschluss haben. Bessere Berufsorientierung, Mobilität und Attraktivität der Ausbildung helfen also wirklich. Aber selbst eine perfekte Ausbildung ändert nichts daran, dass demografisch schlicht weniger Junge nachrücken.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/fachkraeftemangel/laenger-arbeiten/">Einfach alle länger arbeiten lassen — Rente mit 70, dann ist das Problem gelöst.</a></dt>
          <dd>Ältere länger im Job zu halten, hilft tatsächlich — und passiert längst: Die Erwerbstätigenquote der 60- bis 64-Jährigen ist von 53 % (2015) auf 68 % (2025) gestiegen. Genau deshalb ist das zusätzliche Potenzial begrenzt: Modellrechnungen sehen bei den über 50-Jährigen noch rund 414.000 Vollzeitäquivalente. Das steht gegen 7,2 Millionen wegfallende Erwerbspersonen bis 2035. Längeres Arbeiten ist ein sinnvoller Baustein, aber bei Weitem keine Komplettlösung — und körperlich belastende Engpassberufe wie die Pflege lassen sich nicht beliebig verlängern.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/">Innere Sicherheit &amp; Kriminalität: Zahlen, Argumente &amp; Fakten 2026</a></h3>
      <p>Wird Deutschland immer unsicherer? Antworten zu Kriminalitätstrend, Messerangriffen, No-go-Areas, Polizei und Videoüberwachung — Quellen BKA, Destatis und DIW.</p>
      <p>7 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/kriminalitaet-explodiert/">Die Kriminalität explodiert, Deutschland wird immer unsicherer!</a></dt>
          <dd>Tatsächlich liegt die Gesamtkriminalität heute unter dem Niveau der 1990er: 2024 zählte die PKS 5,84 Mio. Straftaten — rund 1,7 % weniger als 2023 und klar unter dem Höchststand von 1993 (6,75 Mio.). Richtig ist: Die Gewaltkriminalität ist real gestiegen und 2024 auf einem Hoch. Aber sie macht nur etwa 3,7 % aller Straftaten aus. ‚Explodiert‘ trifft auf das Gesamtbild nicht zu — die Lage ist differenziert, nicht dramatisch.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/ueberall-messerangriffe/">Überall Messerangriffe, man kann ja gar nicht mehr auf die Straße!</a></dt>
          <dd>Messerangriffe gibt es, und sie werden seit 2024 erstmals systematisch erfasst: 29.014 Fälle, davon gut die Hälfte Gewaltdelikte. Bei der gefährlichen Körperverletzung stieg der Messeranteil von 8.951 (2023) auf 9.620 Fälle (2024) — das ist real und ernst. Aber ‚überall‘ und ‚man kann nicht mehr raus‘ ist Wahrnehmung, nicht Statistik: Tagsüber fühlen sich laut BKA fast 89 % der Menschen auf Straßen und Plätzen sicher. Das individuelle Risiko bleibt sehr gering.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/frueher-ohne-angst/">Früher konnte man nachts noch ohne Angst auf die Straße gehen!</a></dt>
          <dd>Die Nostalgie täuscht: In den 1990ern wurden pro Kopf mehr Straftaten erfasst als heute — 1993 lag die Häufigkeitszahl bei 8.337 pro 100.000 Einwohner, 2024 bei rund 6.894. Objektiv war es ‚früher‘ also nicht sicherer, eher im Gegenteil. Die Kriminalitätsfurcht folgt zudem oft der Stimmungslage, nicht der realen Lage: 2013 war die Sorge vor Kriminalität auf einem Tiefpunkt, 2016 sprang sie deutlich nach oben — bei real kaum veränderter Lage.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/no-go-areas-kapituliert/">In den No-go-Areas hat der Staat doch längst kapituliert!</a></dt>
          <dd>‚No-go-Areas‘ im Sinne rechtsfreier Räume gibt es in Deutschland nach Einschätzung von Polizei und Innenbehörden nicht — schon Berlins Innensenator und Brandenburger Polizeiführung wiesen den Begriff zurück. Was es gibt, sind ‚kriminalitätsbelastete Orte‘ wie der Alexanderplatz oder das Kottbusser Tor. Dort hat die Polizei aber mehr Befugnisse, nicht weniger: verdachtsunabhängige Kontrollen, Durchsuchungen, Videoüberwachung. Das ist das Gegenteil von Kapitulation — es ist gezielt erhöhte Präsenz.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/polizei-kaputtgespart/">Die Polizei ist doch kaputtgespart, es gibt viel zu wenige Polizisten!</a></dt>
          <dd>Tatsächlich wurde die Polizei in den letzten Jahren personell aufgestockt: Zum 30.06.2024 zählten Bund und Länder rund 342.500 Vollzeitäquivalente, davon etwa 294.000 Beamtinnen und Beamte. Schon 2017 gab es den größten Personalzuwachs seit über 20 Jahren. Von ‚kaputtgespart‘ kann beim Personalstand keine Rede sein. Berechtigt ist die Debatte über Belastung, Überstunden, Bürokratie und Ausstattung — aber das ist etwas anderes als zu wenige Stellen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/aufklaerungsquote-keller/">Die Aufklärungsquote ist im Keller, Verbrechen lohnt sich doch!</a></dt>
          <dd>Die Aufklärungsquote ist stabil, nicht im Keller: 2024 lag sie bei 58,0 %, 2025 bei 57,9 % — seit Jahren auf diesem Niveau. Sie schwankt stark nach Delikt: Bei Gewalt- und Tötungsdelikten ist sie hoch, weil Täter und Opfer sich oft kennen; bei Fahrraddiebstahl oder Einbruch ist sie niedrig, weil selten jemand auf frischer Tat gefasst wird. Eine konstante 58-%-Quote als ‚Keller‘ zu bezeichnen, geben die Zahlen nicht her.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/videoueberwachung-macht-sicher/">Mehr Videoüberwachung macht uns endlich sicher!</a></dt>
          <dd>Videoüberwachung kann helfen — aber gezielt, nicht pauschal. Die Forschung zeigt: An überschaubaren Orten und bei planbaren Eigentumsdelikten (etwa Kfz-Diebstahl in Parkhäusern) sinkt die Kriminalität messbar. Bei spontaner Gewalt im Affekt zeigt sie dagegen kaum Wirkung. Der Test in der Berliner U-Bahn brachte keinen Sicherheitsgewinn; in Mannheim stieg bislang nur das subjektive Sicherheitsgefühl, die objektive Wirkung ist erst 2027 belastbar bewertbar. Kameras ersetzen keine Polizei — sie wirken nur im richtigen Kontext.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/osten-am-unsichersten/">Im Osten ist es am unsichersten, kein Wunder bei der Politik dort!</a></dt>
          <dd>Die Zahlen geben das nicht her. Spitzenreiter bei der Kriminalitätshäufigkeit sind die Stadtstaaten Bremen, Berlin und Hamburg — nicht der Osten. Unter den Flächenländern liegt nur Sachsen-Anhalt (8.588 pro 100.000) klar über dem Bundesschnitt (6.995); Mecklenburg-Vorpommern liegt mit 6.878 sogar darunter. Großstädte haben strukturell höhere Werte als ländliche Regionen — das ist ein Stadt-Land-Effekt, kein Ost-West-Graben. 2024 gingen die Fallzahlen in MV und Sachsen-Anhalt sogar zurück.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/innere-sicherheit/auslaender-unsichere-staedte/">Die Ausländer machen unsere Städte unsicher!</a></dt>
          <dd>Die Kriminalstatistik zeigt eine Überrepräsentation nichtdeutscher Tatverdächtiger — das ist real, erklärt sich laut BKA aber zu großen Teilen durch Alter, Geschlecht und soziale Lage: Tatverdächtige sind überall überproportional junge Männer in prekären Verhältnissen, unabhängig vom Pass. Zudem zählen ausländerrechtliche Verstöße mit, die nur Nichtdeutsche begehen können. Pauschal ‚die Ausländer‘ für Unsicherheit verantwortlich zu machen, blendet diese Faktoren aus — eine ausführliche Einordnung findest du im Thema Migration &amp; Asyl.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/">Russland, Ukraine &amp; Sanktionen: Fakten &amp; Argumente 2026</a></h3>
      <p>Schaden Sanktionen uns mehr als Russland? Bringt Ukraine-Hilfe etwas? Ist die NATO schuld? Antworten mit Quellen von EU, Kiel Institute, SIPRI, bpb und Auswärtigem Amt.</p>
      <p>9 Fakten · 11 Argumente</p>
      <details>
        <summary>Argumente (11)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/sanktionen-schaden-uns-mehr/">Die Sanktionen schaden uns mehr als Russland!</a></dt>
          <dd>Die Kosten für Deutschland sind real — Energiepreise, Inflation, Belastungen für Unternehmen. Doch die Größenordnung unterscheidet sich: Russland steckt rund 7,5 % seines BIP ins Militär, die Öl- und Gaseinnahmen sanken 2025 nach eigenen Angaben um etwa 21 %, und die Zentralbank musste den Leitzins zeitweise auf ein Rekordhoch von 21 % anheben. Deutschland federte die Krise mit einem 200-Mrd.-Abwehrschirm ab, und die Inflation ging ab 2023 wieder zurück. Beide Seiten zahlen — aber dass es ‚uns mehr' schadet, tragen die Daten nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/keine-waffen-sofort-frieden/">Wenn wir keine Waffen mehr liefern, ist sofort Frieden!</a></dt>
          <dd>Der Wunsch nach einem schnellen Ende ist verständlich, und mehr Waffen verlängern die Kämpfe — das stimmt. Aber Frieden setzt voraus, dass beide Seiten ihn wollen. Angegriffen wurde die Ukraine; ohne Verteidigungsfähigkeit endet nicht der Krieg, sondern die Gegenwehr. Die Istanbul-Gespräche 2022 zeigten, dass verhandelt werden kann — sie scheiterten aber nicht an Waffenlieferungen. ‚Sofort Frieden' verwechselt das Ende der Lieferungen mit dem Ende des Krieges.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/ukraine-kann-nicht-gewinnen/">Die Ukraine kann eh nicht gewinnen — reine Geldverschwendung.</a></dt>
          <dd>Militärisch ist die Lage festgefahren, das stimmt — ein schneller Sieg ist unwahrscheinlich. Doch ‚gewinnen' wird selten definiert. Die Hilfe zielt nicht auf einen Endsieg, sondern darauf, die Ukraine verhandlungsfähig zu halten: Wer aus einer Position der Schwäche verhandelt, bekommt schlechtere Bedingungen. Die deutsche Militärhilfe ist zudem überwiegend Gerät, kein verschenktes Geld. ‚Verschwendung' unterstellt, das Ergebnis stünde fest — das tut es nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/schuld-nato-osterweiterung/">Schuld ist doch die NATO-Osterweiterung.</a></dt>
          <dd>Es stimmt, dass Russland die NATO-Osterweiterung als Begründung anführt — das ist eine real geäußerte Wahrnehmung. Faktisch gibt es aber keinen bindenden Vertrag über einen Erweiterungsverzicht, und Bündnisbeitritte sind souveräne Entscheidungen der jeweiligen Länder, was Russland 1997 selbst anerkannte. Die Ukraine hatte 2022 keinen konkreten Beitrittsfahrplan. Eine Begründung zu kennen, heißt nicht, einen völkerrechtswidrigen Angriffskrieg zu rechtfertigen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/milliarden-waehrend-hier-alles-zerfaellt/">Wir zahlen Milliarden für die Ukraine, während hier alles zerfällt!</a></dt>
          <dd>Die Summen sind real, und marode Schulen oder Brücken sind ein berechtigtes Ärgernis. Nur konkurriert die Ukraine-Hilfe damit kaum: Die für 2026 geplanten 11,5 Mrd. € sind rund 2 % eines Bundeshaushalts von über 500 Mrd. €, und die kumulierte Hilfe über fast vier Jahre liegt unter dem, was der einmalige Energie-Abwehrschirm 2022 kostete. Wer hier investiert, nimmt es nicht der Infrastruktur weg — beides sind politische Prioritäten, kein Entweder-oder.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/gaspreise-nur-wegen-sanktionen/">Die Gaspreise sind doch nur wegen der Sanktionen explodiert.</a></dt>
          <dd>Die Energiepreise sind 2022 tatsächlich stark gestiegen — aber nicht wegen Gassanktionen: Die EU hat russisches Gas 2022 gar nicht sanktioniert. Es war Russland, das die Lieferungen durch Nord Stream 1 ab Juni 2022 drosselte und im September ganz stoppte, bevor Energie-Embargos überhaupt griffen. Die Preise stiegen also durch die russische Verknappung und die Kriegsunsicherheit. Inzwischen haben sich die Großhandelspreise wieder weitgehend normalisiert.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/sanktionen-wirken-nicht/">Sanktionen wirken doch gar nicht, Russland geht's blendend.</a></dt>
          <dd>Kurzfristig stimmt es: Russlands Wirtschaft wuchs 2024 um 4,3 % und ist nicht kollabiert. Aber dieses Wachstum ist kriegsfinanziert — rund 7,5 % des BIP fließen ins Militär. 2025 brach das Wachstum laut IWF auf 0,6 % ein, die Öl- und Gaseinnahmen sanken um etwa 21 %, und die Zentralbank hielt den Leitzins zeitweise bei 21 %. Sanktionen wirken nicht als Knockout, sondern als langsame Erosion der Spielräume.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/ukraine-korrupt-geld-versickert/">Die Ukraine ist total korrupt, da versickert unser Geld nur.</a></dt>
          <dd>Korruption ist in der Ukraine ein reales, gut dokumentiertes Problem — im Index von Transparency International liegt das Land im hinteren Mittelfeld. Aber zwei Dinge sind entscheidend: Seit dem Euromaidan 2014 hat sich der Wert deutlich verbessert, und die deutsche Militärhilfe ist überwiegend Sachleistung — Panzer, Munition, Flugabwehr —, kein überwiesenes Bargeld, das ‚versickern' könnte. Finanzhilfen sind an Reformauflagen und Kontrollen gebunden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/selenskyj-will-keinen-frieden/">Selenskyj will doch gar keinen Frieden.</a></dt>
          <dd>Tatsächlich gab es ukrainische Verhandlungsangebote — etwa in Istanbul 2022, mit Neutralität gegen Sicherheitsgarantien, und später die Zehn-Punkte-Friedensformel. Dass Kiew auf territorialer Integrität und Garantien besteht, ist kein Kriegswille, sondern die Position der angegriffenen Seite. Frieden scheitert nicht am Willen einer Seite allein — die Forderungen beider Seiten liegen weit auseinander. ‚Will keinen Frieden' blendet aus, wer den Krieg begonnen hat und welche Ziele Russland nennt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/deutschland-wird-hineingezogen/">Deutschland wird in den Krieg hineingezogen!</a></dt>
          <dd>Die Sorge ist nachvollziehbar — niemand will einen größeren Krieg. Rechtlich ist die Unterstützung eines angegriffenen Staates aber etwas anderes als Kriegsbeteiligung: Wer Waffen liefert, wird nach gängiger völkerrechtlicher Auffassung dadurch nicht selbst zur Kriegspartei. Deutschland und die NATO haben bewusst Grenzen gezogen, etwa keine eigenen Truppen in der Ukraine. Das schließt Eskalationsrisiken nicht aus, aber ‚hineingezogen werden' beschreibt einen Automatismus, den es so nicht gibt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/russland-ukraine-sanktionen/russland-hat-sich-nur-verteidigt/">Russland hat sich doch nur gegen die Bedrohung verteidigt.</a></dt>
          <dd>Tatsächlich war es ein Angriff, keine Verteidigung: Am 24. Februar 2022 hat Russland die Ukraine großflächig angegriffen — über eine Grenze, die es 1994 im Budapester Memorandum selbst anerkannt hatte. Die UN-Generalversammlung verurteilte die Aggression mit 141 zu 5 Stimmen. Von einer Bedrohung, die einen Angriff erfordert hätte, war die Ukraine weit entfernt; sie hatte ihre Atomwaffen 1994 abgegeben. Ein Angriffskrieg lässt sich nicht als Verteidigung umdeuten.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/">Wissenschaftsskepsis: Kann man der Wissenschaft trauen? — Faktencheck</a></h3>
      <p>Widersprechen sich Studien ständig? Ist Forschung gekauft? 9 typische Zweifel an der Wissenschaft — mit Daten zu Vertrauen, Klimakonsens und Replikationskrise, belegt und nachprüfbar.</p>
      <p>7 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/studien-widersprechen-sich/">Studien widersprechen sich doch ständig — da kann man eh nichts glauben!</a></dt>
          <dd>Tatsächlich ist Widerspruch ein normaler Teil des Erkenntnisprozesses, kein Beweis für Beliebigkeit. Eine einzelne Studie ist immer vorläufig — verlässlich wird Wissen erst, wenn sich Ergebnisse über viele unabhängige Untersuchungen hinweg verdichten. Dass die Wissenschaft ihre Aussagen bei neuer Evidenz korrigiert, ist gerade die Methode, die sie verlässlich macht. Wer aus zwei widersprüchlichen Schlagzeilen schließt ‚man kann nichts glauben', verwechselt den Forschungsstand mit der Meldung über eine Einzelstudie.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/replikationskrise-alles-kaputt/">Die Replikationskrise beweist, dass die ganze Forschung kaputt ist!</a></dt>
          <dd>Die Replikationskrise ist real und ernst — in der Psychologie ließen sich nur rund 36 % der untersuchten Befunde klar wiederholen. Aufgedeckt wurde sie allerdings von der Wissenschaft selbst, nicht von ihren Gegnern. Und die Reaktion war Reform: Über 300 Fachzeitschriften nutzen heute die Präregistrierung, bei der die Methodik vor der Datenerhebung begutachtet wird. Das Problem betrifft bestimmte Felder und wird aktiv bearbeitet — es ist ein Zeichen funktionierender Selbstkontrolle, keine Bankrotterklärung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/von-industrie-gekauft/">Forschung ist doch eh von der Industrie gekauft!</a></dt>
          <dd>Die Sorge ist berechtigt — Studien mit Industriefinanzierung kommen nachweislich häufiger zu herstellergünstigen Ergebnissen (Cochrane: relatives Risiko 1,27). Genau deshalb gibt es Offenlegungspflichten, unabhängige Replikation und Peer Review, die solche Verzerrungen sichtbar machen sollen. Pauschal ‚gekauft' ist die Forschung damit aber nicht: Ein erheblicher Teil läuft an öffentlich finanzierten Hochschulen und Instituten. Entscheidend ist nicht, ob es Interessenkonflikte gibt, sondern ob sie offengelegt und kontrolliert werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/forscher-uneinig-klima/">Die Wissenschaftler sind sich beim Klima doch selbst nicht einig!</a></dt>
          <dd>Bei den Grundfragen ist die Einigkeit überwältigend: Cook et al. (2013) fanden in 97,1 % der Fachartikel mit Position Zustimmung zum menschengemachten Klimawandel, eine Folgestudie von 2021 kam sogar auf über 99 %. Uneinigkeit gibt es bei Detailfragen — etwa zum exakten Tempo einzelner Effekte —, nicht bei der Grundursache. Diese normale Debatte über Details als ‚grundsätzliche Uneinigkeit' darzustellen, verwechselt wissenschaftliche Feinarbeit mit einem offenen Grundsatzstreit.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/rauchen-war-gesund/">Früher war Rauchen laut Wissenschaft doch auch gesund!</a></dt>
          <dd>Das ist ein hartnäckiger Mythos: Die Wissenschaft hat die Gesundheitsgefahren des Rauchens früh erkannt — verschleiert wurden sie gezielt von der Tabakindustrie. Ein internes Memo von 1969 bringt deren Strategie auf den Punkt: ‚Doubt is our product' — Zweifel zu säen war das erklärte Ziel, um den Faktenkörper der Wissenschaft zu untergraben. Hier hat also nicht die Forschung versagt, sondern eine Industrie hat sie aktiv bekämpft. Der Fall zeigt das Gegenteil der Behauptung: Man musste der Wissenschaft glauben, nicht der bezahlten PR.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/eigene-recherche/">Ich mach mir mit eigener Recherche meine Meinung — das ist genauso gut!</a></dt>
          <dd>Eigenständiges Nachdenken ist wertvoll — aber ‚selbst googeln' ersetzt keine Fachprüfung. Eine Studie in Nature (Aslett et al. 2024) zeigt sogar das Gegenteil des Erhofften: Wer Falschnachrichten per Online-Suche überprüfte, hielt sie danach eher für wahr. Grund sind ‚data voids' — zu vielen Falschbehauptungen liefert die Suche überwiegend unseriöse Treffer. Fachleute unterscheiden sich von Laien nicht durch den Zugang zu Informationen, sondern durch die Fähigkeit, deren Qualität zu gewichten.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/nur-eine-theorie/">Das ist doch alles nur eine Theorie!</a></dt>
          <dd>Hier liegt ein Missverständnis des Begriffs vor: Im Alltag heißt ‚Theorie' bloße Vermutung, in der Wissenschaft das Gegenteil. Eine wissenschaftliche Theorie ist laut der US-amerikanischen National Academy of Sciences eine ‚gut belegte Erklärung eines Aspekts der natürlichen Welt', die Fakten, Gesetze und geprüfte Hypothesen zusammenführt. Die Evolutions- oder die Relativitätstheorie sind in diesem Sinne keine Spekulationen, sondern vielfach bestätigte Erklärungsgebäude. Etwas als ‚nur eine Theorie' abzutun, verwechselt Umgangs- mit Fachsprache.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/nur-foerdergelder/">Die wollen doch nur Fördergelder, deshalb übertreiben sie die Ergebnisse!</a></dt>
          <dd>Dass Forschende auf Finanzierung angewiesen sind, stimmt — die Anreize wirken aber in beide Richtungen. Spektakuläre Ergebnisse erhöhen zwar die Publikations- und damit Förderchancen, was zum Publication Bias beiträgt. Zugleich durchläuft jedes Ergebnis Peer Review und wird von Konkurrenten nachgeprüft, die mit dem Widerlegen etablierter Befunde selbst Reputation gewinnen; wessen Ergebnisse sich nicht reproduzieren lassen, verliert an Glaubwürdigkeit. Ein einseitiger Anreiz, dauerhaft zu übertreiben, lässt sich daraus nicht ableiten — Übertreibung trägt das Risiko, beim Nachprüfen aufzufliegen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/wissenschaftsskepsis/corona-staendig-geirrt/">Bei Corona hat sich die Wissenschaft doch ständig geirrt!</a></dt>
          <dd>Dass sich Empfehlungen geändert haben, stimmt — bei einem neuen Virus ist das meist kein Irrtum, sondern die Methode: Wissen wird an neue Daten angepasst. Die anfängliche Überschätzung der Übertragung über Oberflächen etwa wurde korrigiert, als sich die Aerosolübertragung als entscheidend erwies. Nicht jede Kehrtwende war reine Wissenschaft — bei der Maskenfrage spielten zeitweise auch Materialknappheit und politische Abwägungen mit. Bemerkenswert ist trotzdem, dass das Vertrauen in die Wissenschaft in der Pandemie sogar stieg — im April 2020 auf 73 %. Eine Position bei neuer Evidenz zu revidieren ist ein Qualitätsmerkmal, kein Versagen; problematisch wäre das Festhalten an überholten Annahmen.</dd>
        </dl>
      </details>
      <h2>So nutzt du Fakten-Stammtisch effektiv</h2>
      <p>Jede Themenseite folgt demselben Aufbau: zuerst die typische Stammtisch-Behauptung, dann die kompakte, quellenbasierte Antwort. Damit kannst du in einer Diskussion direkt reagieren, ohne zwischen Tabs zu suchen. Wer tiefer einsteigen will, findet darunter den vollständigen Faktenteil mit Zahlen, Einordnungen und Quellen — du entscheidest, ob die kurze Replik reicht oder das ganze Thema dran ist.</p>
      <p>Die Inhalte sind bewusst auf Deutschland zugeschnitten und in klarer Alltagssprache formuliert. Es geht nicht um parteipolitische Parolen, sondern um belastbare Information, die du in echten Gesprächen sauber verwenden kannst. Zu jeder Aussage gibt es verlinkte Quellen — von amtlichen Statistiken über Studien bis zu Behördenangaben — damit du jede Zahl bei Rückfragen nachvollziehen und belegen kannst.</p>
      <p>In der Praxis heißt das: kein Studienberg im Kopf nötig. Suche das Thema über die Suchleiste, lies die zugespitzte Antwort, springe bei Bedarf in den Fakten-Tab. So bleibst du sachlich, kannst Behauptungen einordnen und bist auf wiederkehrende Stammtisch-Sprüche vorbereitet.</p>
      <h2>Was hinter Fakten-Stammtisch steht</h2>
      <p>Fakten-Stammtisch ist ein privates, nicht-kommerzielles Projekt von Marcel Deutschel — kein Faktencheck-Portal im journalistischen Sinn, kein Wikipedia-Ersatz, kein Werbe- oder Affiliate-Angebot. Hintergrund, Motivation, Verantwortung und Grenzen des Projekts sind ausführlich auf der <a href="https://fakten-stammtisch.de/ueber/">Über-Seite</a> beschrieben.</p>
      <h2>Wie die Inhalte geprüft werden</h2>
      <p>Jedes Topic durchläuft denselben Prüfprozess: Recherche, strukturierte Aufbereitung, automatisierte Quellenverifizierung und inhaltliche Prüfung gegen acht Qualitätsdimensionen — von Nuance über Claim-Source-Fit bis zur Gesprächstauglichkeit der Argumente. Den vollständigen Workflow, das Bewertungsschema für einzelne Behauptungen und die Grenzen der Methodik beschreibt die <a href="https://fakten-stammtisch.de/methodik/">Methodik-Seite</a>. Praktische Tipps für die Gesprächssituation: <a href="https://fakten-stammtisch.de/leitfaden/">Gesprächsleitfaden</a>.</p>
      <h2>Wie die Inhalte hier entstehen</h2>
      <p>Zu jeder Zahl gehört eine verlinkte Primärquelle. Jedes Argument durchläuft einen automatisierten Prüfprozess für Quellenverifizierung und argumentative Qualität — die Skripte dafür liegen offen im Repository. Korrekturen zu falschen Zahlen, kaputten Quellen-Links oder schiefen Argumentationen sind über Feedback und GitHub-Issues möglich und erwünscht. Die Erstellung der Inhalte erfolgt mit Sprachmodellen; Verantwortung für Veröffentlichung und Methodik trägt der Betreiber. Eine redaktionelle Vollprüfung jeder einzelnen Aussage findet bewusst nicht statt — die Qualität soll vom Workflow getragen werden, nicht von einem einzelnen Lektorat.</p>
      <h2>Quellen &amp; Transparenz</h2>
      <p>Alle Aussagen auf dieser Seite werden mit Primärquellen belegt (Studien, amtliche Statistiken, Fachinstitute). Die vollständige Quellenliste ist auf jeder Themenseite einsehbar.</p>
