      <h1>Fakten-Stammtisch</h1>
      <p>Faktenbasierte Argumente und Quellen zu politischen und gesellschaftlichen Themen in Deutschland.</p>
      <h2>Fakten und Argumente für den Stammtisch</h2>
      <p>Kompakte Antworten, geprüfte Quellen und anschlussfähige Argumente zu den Streitthemen, die in Deutschland regelmäßig am Stammtisch, beim Grillen oder im Familiengruppenchat hochkochen — Bürgergeld, Energiewende, Migration, Heizungswechsel, Gendern und mehr. Mobil-first, werbefrei, ohne Tracking — gemacht für den Moment, in dem du in zwanzig Sekunden eine belegbare Antwort brauchst.</p>
      <p>Alle Inhalte als Textdatei: <a href="https://fakten-stammtisch.de/llms-full.txt">fakten-stammtisch.de/llms-full.txt</a></p>
      <h2>Themen</h2>
      <h3><a href="https://fakten-stammtisch.de/thema/heizung/">Wärmepumpe vs. Gasheizung 2026: Argumente &amp; Fakten</a></h3>
      <p>Lohnt sich die Wärmepumpe? Funktioniert sie bei Frost? Quellengeprüfte Antworten zu den 9 häufigsten Behauptungen rund um den Heizungswechsel.</p>
      <p>14 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/wp-nur-neubau/">Wärmepumpe lohnt sich nur im Neubau!</a></dt>
          <dd>Falsch. Fraunhofer ISE hat 77 Bestandsgebäude vermessen, darunter sehr alte Gebäude, und keinen Zusammenhang zwischen Baujahr und Effizienz gefunden. Entscheidend sind Heizkörpergröße, Hydraulik und saubere Auslegung. Fußbodenheizung ist nicht zwingend nötig. Außerdem gehen rund 80 % der neuen Wärmepumpen in Bestandsgebäude.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/gas-billiger/">Gas ist doch viel billiger!</a></dt>
          <dd>In der Anschaffung ist Gas oft günstiger. Im Betrieb spart eine Wärmepumpe bei einem typischen EFH (20.000 kWh, JAZ 3,5) aber rund 950 €/Jahr gegenüber Gas — und das schon bei heutigen Preisen. Jeder CO₂-Preisanstieg vergrößert den Vorteil weiter: 55 €/t CO₂ kosten den Gashaushalt ca. 220 €/Jahr, bei 160 €/t schon 650 €/Jahr extra.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/gasnetz-bleibt/">Das Gasnetz bleibt doch!</a></dt>
          <dd>MVV strebt in Mannheim die Stilllegung des Gasnetzes bis 2035 an. DIW warnt, dass Netzentgelte mit sinkender Kundenzahl stark steigen können. Die aktuelle VKU-Umfrage zeigt außerdem, dass viele Stadtwerke vor allem mit Wärmepumpen und Fernwärme planen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/wasserstoff-loesung/">Wasserstoff wird alles lösen!</a></dt>
          <dd>Die aktuelle VKU-Umfrage sieht grüne Gase nur bei 5 % der befragten Unternehmen als Hauptlösung. MVV hält Biomethan wegen fehlender Mengen und Wasserstoff aus Kostengründen für Privathaushalte nicht für tragfähig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/heizungsgesetz-abgeschafft/">Heizungsgesetz ist doch abgeschafft!</a></dt>
          <dd>Über die Reform der Heizungsregeln wird 2026 politisch verhandelt. Belastbar ist vor allem: Der nationale CO₂-Preis endet 2026 im Korridor, ab 2027 startet ETS 2, und neue fossile Investitionen bleiben preis- und infrastrukturnah riskant.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/heizung-funktioniert-noch/">Meine Heizung funktioniert doch noch!</a></dt>
          <dd>Viele Heizungen im Bestand sind alt: Laut BDH und ZVSHK ist über die Hälfte der 21,7 Mio. Heizungen veraltet, mehr als 4 Mio. sind über 30 Jahre alt. Wer früh tauscht, kann aktuelle Förderboni eher noch nutzen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/wp-zu-laut/">Die Wärmepumpe ist doch viel zu laut!</a></dt>
          <dd>Luftwärmepumpen müssen sorgfältig geplant werden. Typische Geräuschangaben liegen oft bei etwa 40–50 dB; Aufstellort, Abstand und Nachtmodus sind entscheidend. In reinen Wohngebieten gilt nachts regelmäßig ein Immissionsrichtwert von 35 dB(A) nach TA Lärm.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/stromnetz-bricht-zusammen/">Das Stromnetz bricht doch zusammen!</a></dt>
          <dd>Wärmepumpen erhöhen den Strombedarf, aber Netzfragen sind vor allem lokal und hängen stark von Steuerung und Ausbauplanung ab. Entscheidend ist, dass Wärmepumpen sinnvoll ins Verteilnetz integriert und möglichst flexibel betrieben werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/heizung/wp-funktioniert-nicht-bei-kaelte/">Bei richtigem Frost funktioniert die WP nicht!</a></dt>
          <dd>Praxisdaten zeigen, dass Wärmepumpen auch in Bestandsgebäuden effizient laufen. Zudem kommen in Norwegen 632 installierte Wärmepumpen auf 1.000 Haushalte. Entscheidend sind gute Auslegung und passende Heizflächen, nicht pauschale Frost-Mythen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/emobilitaet/">E-Auto vs. Verbrenner: Akku, CO₂, Kosten — Fakten 2026</a></h3>
      <p>Hält der Akku nur 5 Jahre? Bricht das Stromnetz? Quellengeprüfte Antworten zu 7 verbreiteten E-Auto-Behauptungen — TCO, Klimabilanz, Reichweite.</p>
      <p>7 Fakten · 7 Argumente</p>
      <details>
        <summary>Argumente (7)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/akku-kaputt/">Nach 3 bis 5 Jahren ist der Akku kaputt und ein neuer kostet 15.000 Euro.</a></dt>
          <dd>Pauschal falsch. Marktstandard ist 8 Jahre oder 160.000 km Garantie auf mindestens 70 % Kapazität. BYD garantiert sogar 250.000 km. Ein Austausch nach 3–5 Jahren ist die Ausnahme, nicht die Regel. Und selbst ausgemusterte Akkus unter 80 % Kapazität werden als stationäre Speicher weitergenutzt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/stromnetz-kollaps/">Wenn alle abends ihr E-Auto anstecken, bricht das Stromnetz zusammen.</a></dt>
          <dd>Nein. Netzbetreiber dürfen neue steuerbare Ladeeinrichtungen nicht pauschal wegen lokaler Engpässe ablehnen. Im Engpassfall darf der Strombezug nach § 14a EnWG vorübergehend auf 4,2 kW reduziert werden; diese Mindestleistung muss laut Bundesnetzagentur immer verfügbar bleiben.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/co2-rucksack/">Wegen der Batterieproduktion ist ein E-Auto klimaschädlicher als ein Diesel.</a></dt>
          <dd>Falsch. Laut ICCT verursachen 2025 in Europa verkaufte Batterie-Elektroautos über ihren Lebenszyklus rund 73 % weniger Treibhausgasemissionen als vergleichbare Benziner. Der höhere CO₂-Fußabdruck der Produktion wird im Fahrbetrieb wieder ausgeglichen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/kobalt-kinderarbeit/">Für E-Autos schuften Kinder im Kongo für Kobalt.</a></dt>
          <dd>Die Probleme im Rohstoffabbau sind real und müssen ernst genommen werden. Gleichzeitig sinkt der Einsatz kritischer Materialien bei manchen Batterietypen, LFP-Akkus kommen ohne Kobalt und Nickel aus, und die EU verschärft die Recyclingvorgaben für Batterierohstoffe deutlich.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/wasserstoff-zukunft/">Batterien sind nur eine Brückentechnologie, Wasserstoff und E-Fuels sind die Zukunft.</a></dt>
          <dd>Die Physik spricht eher für direkte Elektrifizierung. Im Pkw ist das Batterieauto deutlich effizienter als Wasserstoff oder E-Fuels. Diese Energieträger werden vor allem dort gebraucht, wo Batterien an Grenzen stoßen, etwa in Luftfahrt, Schifffahrt oder Teilen der Industrie.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/brennende-autos/">E-Autos brennen ständig und können nicht gelöscht werden.</a></dt>
          <dd>Die pauschale Behauptung stimmt nicht. Laut BMUKN brennen Elektroautos nicht häufiger als andere Fahrzeuge. Wenn ein Akku-Brand entsteht, ist das Löschen zwar aufwendiger, aber für Feuerwehren ist das ein bekanntes und beherrschbares Szenario.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/emobilitaet/reichweite/">Mit dem E-Auto komme ich nicht in den Urlaub nach Italien.</a></dt>
          <dd>Aktuelle E-Autos der Kompaktklasse erreichen 350–500 km WLTP-Reichweite. Eine Schnellladung von 10 auf 80 % dauert bei modernen Fahrzeugen rund 25–30 Minuten und lädt Strom für circa 200–300 km nach. Auf einer Fahrt München–Gardasee (ca. 480 km) wäre also ein Ladestopp nötig — ähnlich einer normalen Rast- oder Tankpause.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/energiewende/">Energiewende &amp; Atomkraft: Argumente, Kosten, Versorgung</a></h3>
      <p>Hätten AKW die Gaskrise gelöst? Sind SMRs realistisch? Antworten zu Atomausstieg, Strommix und Versorgungssicherheit — Quellen BNetzA und Fraunhofer.</p>
      <p>16 Fakten · 8 Argumente</p>
      <details>
        <summary>Argumente (8)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/zeig-mir-das-akw/">Zeig mir das AKW, das du bauen willst.</a></dt>
          <dd>Große westliche AKW-Neubauten sind teuer, dauern lange und bleiben regelmäßig nicht im Startbudget. In Deutschland kämen zusätzlich fehlende Lieferketten, Fachkräfte und Genehmigungsroutinen hinzu. Wer heute neu beschließt, bekommt realistisch erst in den 2040er Jahren relevanten Strom.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/akw-ersetzen-keinen-schritt/">AKW ersetzen keinen einzigen Schritt der Energiewende.</a></dt>
          <dd>Auch ein großer AKW-Neubau würde Netze, Speicher, flexible Lasten und Erneuerbare nicht ersetzen. Bei wachsendem Strombedarf bleibt der Ausbau dieser Infrastruktur in jedem realistischen Szenario unvermeidlich.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/krise-war-gas-nicht-strom/">Die Krise war Gas, nicht Strom.</a></dt>
          <dd>Die Energiekrise 2022 war vor allem eine Gaskrise. Kernkraft erzeugt Strom, ersetzt aber kein Gas in Heizungen oder Industrieöfen. Zudem bleibt auch Atomkraft auf internationale Lieferketten angewiesen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/problem-heisst-buerokratie/">Das Problem heißt Bürokratie, nicht Technologie.</a></dt>
          <dd>Der Speichermarkt zeigt viel Interesse, aber Netzanschlüsse, Genehmigungen und Regulierung bremsen die Umsetzung. Das Problem ist deshalb heute oft weniger die Technik als die Geschwindigkeit von Verfahren und Netzausbau.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/smr-loest-alles/">Aber SMRs lösen doch das Problem!</a></dt>
          <dd>SMR sind bislang eher ein Technologieversprechen als ein erprobter Massenmarkt. Im Westen gibt es noch keinen kommerziell etablierten SMR-Betrieb; selbst das fortgeschrittene Darlington-Projekt liefert keine kurzfristige Antwort für Deutschland. Parallel braucht es trotzdem Netze, Speicher und Erneuerbare.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/atommuell-erledigt/">Atomkraft ist doch abgeschaltet und erledigt!</a></dt>
          <dd>Abgeschaltet heißt nicht erledigt. Endlagersuche, Zwischenlagerung und Finanzierung bleiben über Jahrzehnte bis Generationen ein Thema. Neue AKW würden diese Aufgabe nicht kleiner machen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/deutschland-muss-sich-selbst-versorgen/">Deutschland muss sich doch selbst versorgen können!</a></dt>
          <dd>Der europäische Stromverbund ist Teil der Versorgungssicherheit. Import und Export gleichen regionale Unterschiede aus und sind kein Versagenssignal. Vollständige Autarkie wäre teurer und systemisch unflexibler als ein gut vernetztes europäisches Stromsystem.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/energiewende/windraeder-diesel/">Windkraftanlagen werden mit Dieselmotoren betrieben!</a></dt>
          <dd>Nein. Windräder wandeln Windenergie über einen Generator in Strom um — dafür brauchen sie keinen Diesel. Was stimmt: In seltenen Ausnahmefällen kommen Dieselaggregate zum Einsatz — etwa 2023 in Schottland, als 71 Turbinen nach einem Netzfehler bei Frost mit Diesel warmgehalten wurden. Das war eine Notfallmaßnahme, kein Regelbetrieb. Das Pitch-System, das die Rotorblätter bei Sturm aus dem Wind dreht, nutzt Batterien oder Ultrakondensatoren. Auch Schmieröl im Getriebe ist kein Treibstoff. Laut Umweltbundesamt hat eine Windkraftanlage die Energie für ihren Bau nach wenigen Monaten wieder eingespielt.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/klimawandel/">Klimawandel: Argumente, Fakten &amp; Mythen im Faktencheck</a></h3>
      <p>Hat sich das Klima schon immer verändert? Sind Forscher uneins? Antworten zu Temperatur, CO₂, Extremwetter und Kippelementen — Quellen IPCC und DWD.</p>
      <p>7 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/klima-schon-immer/">Das Klima hat sich schon immer verändert!</a></dt>
          <dd>Stimmt, das Klima hat sich schon immer verändert. Entscheidend ist aber: Der heutige CO₂-Anstieg und die aktuelle Erwärmung verlaufen viel schneller als die natürlichen Veränderungen nach der letzten Eiszeit. Das erschwert die Anpassung von Ökosystemen und Gesellschaft.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/deutschland-allein/">Deutschland allein kann das Klima nicht retten!</a></dt>
          <dd>Deutschland allein entscheidet das Klima nicht. Aber mit 6,8 Tonnen CO₂ pro Kopf liegt Deutschland 45 % über dem Weltdurchschnitt (4,7 t) und mehr als dreimal so hoch wie Indien (2,0 t). Historisch gehört Deutschland zu den größten Emittenten. Wenn wohlhabende Industrieländer nicht mitreduzieren, fehlt Glaubwürdigkeit und Tempo für internationale Klimapolitik.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/klimaschutz-arbeitsplaetze/">Klimaschutz kostet Arbeitsplätze!</a></dt>
          <dd>Klimaschutz verschiebt Beschäftigung stärker, als dass er pauschal Jobs vernichtet. Weltweit arbeiten laut IRENA bereits 16,6 Mio. Menschen in den Erneuerbaren. In Deutschland sind Energiewende-Berufe in den letzten Jahren stark gewachsen. Entscheidend ist, den Strukturwandel mit Qualifizierung und regionaler Unterstützung zu begleiten.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/wissenschaftler-uneinig/">Die Wissenschaftler sind sich doch gar nicht einig!</a></dt>
          <dd>Doch. Metaanalysen kommen auf einen wissenschaftlichen Konsens von über 99 %, und der IPCC hält den menschlichen Einfluss auf die Erwärmung für eindeutig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/gar-nicht-waermer/">Es ist doch gar nicht wärmer geworden — letzter Winter war kalt!</a></dt>
          <dd>Wetter ist nicht Klima. Ein kalter Winter in Deutschland widerlegt den globalen Trend nicht: 2024 war weltweit das wärmste Jahr seit Beginn der Aufzeichnungen. In Europa werden Kälteperioden insgesamt seltener, auch wenn einzelne kalte Winter weiter vorkommen können.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/co2-gut-fuer-pflanzen/">CO₂ ist doch gut für Pflanzen!</a></dt>
          <dd>Mehr CO₂ kann Pflanzen unter kontrollierten Bedingungen beim Wachstum helfen. Im Freiland begrenzen aber Wasser, Nährstoffe, Hitze und Extremwetter diesen Effekt. Für Landwirtschaft und Ökosysteme ist das deshalb kein Entwarnungssignal.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/china-indien-schlimmer/">China und Indien sind doch viel schlimmer!</a></dt>
          <dd>China stößt heute absolut sehr viel CO₂ aus, Indien pro Kopf aber deutlich weniger als Deutschland. Für faire Vergleiche zählen neben aktuellen Emissionen auch Pro-Kopf-Werte, historische Beiträge und der Handel. Daraus folgt nicht, dass Deutschland nichts tun müsste.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/vulkane-mehr-co2/">Vulkane stoßen mehr CO₂ aus als Menschen!</a></dt>
          <dd>Nein. Menschliche Aktivitäten emittieren laut NOAA mindestens etwa 60-mal mehr CO₂ pro Jahr als alle Vulkane zusammen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/klimawandel/zu-teuer/">Klimaschutz können wir uns nicht leisten!</a></dt>
          <dd>Belastbar ist vor allem: Klimaschutz erfordert hohe Investitionen, aber verzögertes Handeln erhöht Risiken und Zusatzkosten. Der IPCC warnt vor Carbon Lock-ins und stranded assets; die IEA veranschlagt im Net-Zero-Pfad bis Anfang der 2030er weltweit rund 4,5 Billionen US-Dollar pro Jahr für Clean Energy.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/verkehrswende/">Verkehrswende: E-Auto, ÖPNV, Radverkehr — Argumente 2026</a></h3>
      <p>Tötet Autofreiheit den Einzelhandel? E-Autos auch auf dem Land? Antworten zu E-Mobilität, ÖPNV, Radwegen und Tempo 30 — Quellen UBA und KBA.</p>
      <p>7 Fakten · 12 Argumente</p>
      <details>
        <summary>Argumente (12)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-strommix/">E-Autos sind doch gar nicht umweltfreundlicher, wenn der Strom aus Kohle kommt!</a></dt>
          <dd>Auch mit dem heutigen deutschen Strommix sind E-Autos laut UBA über den Lebenszyklus klar klimafreundlicher als Benziner. 2025 deckten Erneuerbare bereits 55,3 % des Stromverbrauchs. Mit jedem weiteren Ausbau von Wind und Solar wächst der Klimavorteil batterieelektrischer Fahrzeuge, während Verbrenner auf fossile Kraftstoffe angewiesen bleiben.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-efuels/">Wir sollten einfach E-Fuels tanken, dann können wir unsere Verbrenner behalten.</a></dt>
          <dd>E-Fuels sind für Pkw der ineffiziente Umweg. Das UBA hält direkte Stromnutzung im E-Auto für deutlich effizienter und sieht strombasierte Kraftstoffe vor allem dort, wo Batterien an Grenzen stoßen - etwa im Luft- und Seeverkehr. Für den Massen-Pkw-Verkehr wären E-Fuels deshalb teuer und verschwenderisch.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-dticket/">Das Deutschlandticket ist ein Milliardengrab und bringt niemanden dazu, das Auto stehen zu lassen.</a></dt>
          <dd>Mit rund 14,6 Millionen Nutzenden Ende 2025 ist das Deutschlandticket stark verbreitet. Laut VDV blieb selbst nach der Preiserhöhung 2026 die Kündigungsquote bei 5,75 %. Das Ticket vereinfacht den Tarifdschungel massiv und erleichtert vielen Menschen den Zugang zum ÖPNV.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-reichweite/">Die Reichweite von E-Autos ist viel zu gering für den Alltag.</a></dt>
          <dd>Die durchschnittliche Alltagsmobilität liegt deutlich unter typischen E-Auto-Reichweiten. Für den Alltag reichen moderne E-Autos deshalb oft aus. Zudem wächst die öffentliche Ladeinfrastruktur weiter, und viele Ladevorgänge finden zu Hause oder am Arbeitsplatz statt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-stromnetz/">Das Stromnetz bricht zusammen, wenn alle elektrisch fahren.</a></dt>
          <dd>Das Stromnetz muss für mehr E-Mobilität ausgebaut und lokal intelligent gesteuert werden. Genau dafür gibt es inzwischen Regeln wie § 14a EnWG. Die Herausforderung heißt Lastmanagement und Netzausbau, nicht flächendeckender Blackout.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-ladeinfrastruktur/">Auf dem Land gibt es keine Ladesäulen, E-Autos funktionieren nur in der Stadt!</a></dt>
          <dd>Von fehlender Ladeinfrastruktur kann bundesweit keine Rede mehr sein: Anfang Februar 2026 waren bei der Bundesnetzagentur 196.353 öffentliche Ladepunkte gemeldet. Regionale Lücken gibt es weiter, aber das Netz wächst stark. Außerdem finden viele Ladevorgänge zu Hause oder am Arbeitsplatz statt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-innenstadt/">Autofreie Innenstädte töten den Einzelhandel!</a></dt>
          <dd>Ein genereller Umsatzeinbruch durch autoarme Innenstädte ist empirisch nicht gut belegt. Eine RIFS-Auswertung zeigt für zwei untersuchte Einkaufsstraßen: Nur 6,6 % der Kundschaft kam mit dem Auto, aber 91 % des Umsatzes stammten von Menschen, die zu Fuß, mit dem Rad oder dem ÖPNV unterwegs waren. Attraktive, gut erreichbare Zentren helfen dem lokalen Handel eher, als dass sie ihm schaden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-radwege/">Radwege sind Geldverschwendung — die nutzt doch kaum jemand!</a></dt>
          <dd>Radwege sind keine Geldverschwendung, wenn sie sicher geplant und an Alltagspfade angeschlossen werden. Gute Infrastruktur erhöht nachweislich die Nutzung und macht Mobilität günstiger, gesünder und platzsparender. Besonders E-Bikes erweitern das Potenzial weit über die Innenstadt hinaus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-tempo30/">Tempo 30 in der Stadt ist völlig übertrieben und bringt nichts.</a></dt>
          <dd>Tempo 30 senkt die Unfallschwere und reduziert Straßenlärm. Das UBA empfiehlt deshalb Tempo 30 als innerörtliche Regelgeschwindigkeit. Es geht nicht um Schikane, sondern um Sicherheit und Lebensqualität.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-autoland/">Deutschland ist ein Autoland — ohne Auto kommst du nicht zur Arbeit!</a></dt>
          <dd>Deutschland ist stark aufs Auto ausgerichtet, aber nicht überall gleich. In vielen Städten leben viele Haushalte längst ohne eigenes Auto. Das Kernproblem ist oft nicht fehlende Bereitschaft zur Veränderung, sondern das Fehlen guter Alternativen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-suv-sicher/">SUVs sind sicherer für meine Familie, deshalb brauche ich einen.</a></dt>
          <dd>SUVs mögen für die Insassen subjektiv sicher wirken, erhöhen für Fußgänger aber oft das Risiko schwerer Verletzungen. IIHS-Analysen zeigen, dass Fahrzeuge mit hohen und steilen Fronten deutlich häufiger tödliche Fußgängerunfälle verursachen als niedrigere, schrägere Fahrzeuge. Mehr Sicherheit entsteht vor allem durch niedrigere Geschwindigkeiten und sichere Infrastruktur - nicht durch immer massivere Fahrzeuge.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/verkehrswende/arg-grossstadtthema/">Verkehrswende ist doch nur ein Großstadtthema — auf dem Land braucht man das Auto!</a></dt>
          <dd>Gerade auf dem Land ist die Abhängigkeit vom Auto oft am größten. Deshalb braucht es dort bessere Bus- und Bahnangebote, Rufbusse, sichere Radwege und bezahlbare Alternativen. Verkehrswende heißt nicht Auto verbieten, sondern Wahlfreiheit schaffen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/buergergeld/">Bürgergeld 2026: Lohnt sich Arbeit noch? Fakten &amp; Quellen</a></h3>
      <p>Bürgergeld als Hängematte? Lohnabstand, Sanktionen, Mythen vs. Daten – Antworten auf 8 Stammtisch-Behauptungen mit Quellen aus IAB, BMAS und Destatis.</p>
      <p>6 Fakten · 8 Argumente</p>
      <details>
        <summary>Argumente (8)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/lohnabstand/">Wer arbeitet, ist doch der Dumme. Mit Bürgergeld hat man am Ende mehr in der Tasche!</a></dt>
          <dd>Das stimmt nicht. Das Lohnabstandsgebot ist in der WSI-Modellrechnung gewahrt. Im Bundesdurchschnitt hat ein Single, der Vollzeit zum Mindestlohn arbeitet, 557 Euro mehr im Monat zur Verfügung als im Bürgergeldbezug (Stand 2025, Basis 12,82 €). Bei Alleinerziehenden mit einem Kind sind es 749 Euro. Seit Januar 2026 liegt der Mindestlohn bei 13,90 € — der Abstand ist rechnerisch noch größer. In Städten mit sehr hohen Mieten kann der Abstand geringer ausfallen, bleibt aber im Bundesdurchschnitt deutlich positiv.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/haengematte/">Das Bürgergeld ist eine soziale Hängematte. Man muss gar nichts mehr machen und bekommt trotzdem Geld.</a></dt>
          <dd>Der Vergleich zu Hartz IV hat einen Kern: Mit der Bürgergeld-Reform 2023 wurden Sanktionen zunächst abgemildert — das war politisch umstritten und wurde 2024 teilweise korrigiert. Heute ist das Bürgergeld wieder an konkrete Mitwirkungspflichten geknüpft: Wer Termine beim Jobcenter unentschuldigt versäumt oder zumutbare Arbeit ablehnt, muss mit Leistungsminderungen rechnen. Bei wiederholter Verweigerung einer tatsächlich verfügbaren zumutbaren Arbeit kann der Regelbedarf seit März 2024 unter engen gesetzlichen Voraussetzungen für bis zu zwei Monate vollständig entfallen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/erhoehung/">Die Bürgergeld-Empfänger bekommen jedes Jahr massiv mehr Geld, während die Löhne stagnieren!</a></dt>
          <dd>Die Regelsätze werden nach einem gesetzlichen Mechanismus an Preis- und Lohnentwicklung angepasst. Für 2025 und 2026 blieben die Regelbedarfe unverändert. Der Regelbedarf für Alleinstehende liegt deshalb weiter bei 563 Euro.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/betrug/">Das System wird doch nur ausgenutzt. Fast alle betrügen beim Bürgergeld!</a></dt>
          <dd>Leistungsmissbrauch existiert und wird von der Bundesagentur für Arbeit systematisch erfasst. 2024 wurden rund 101.600 Verdachts- und Missbrauchsfälle registriert — das sind knapp 1,8 Prozent der rund 5,55 Millionen Leistungsberechtigten. Für pauschale Aussagen wie ‚fast alle betrügen' gibt es keinen belastbaren Beleg. Die BA weist selbst darauf hin, dass ihre Statistik unvollständig ist und keine Gesamtquote bezifferbar macht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/auslaender/">Das Bürgergeld lockt nur Ausländer an, die sich hier auf unsere Kosten ein schönes Leben machen.</a></dt>
          <dd>Nicht jeder ausländische Staatsangehörige hat Anspruch auf Bürgergeld. Asylbewerber erhalten Leistungen nach dem AsylbLG — das sind ca. 460–480 € statt 563 € (mindestens rund 80–100 € weniger als Bürgergeld). Erst nach 36 Monaten erweitert sich der Leistungsumfang. EU-Bürger sind in den ersten drei Monaten sowie bei Aufenthaltsrecht allein zur Arbeitsuche in der Regel ausgeschlossen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/ukraine/">Ukraine-Flüchtlinge bekommen sofort Bürgergeld, ohne jemals eingezahlt zu haben!</a></dt>
          <dd>Der Kern der Aussage stimmt: Ukrainische Geflüchtete mit Schutzstatus nach § 24 AufenthG können seit dem 1. Juni 2022 bei Hilfebedürftigkeit Bürgergeld beantragen — früher als andere Schutzsuchende. Richtig ist auch: Sie haben nicht in das System eingezahlt. Das ist aber kein Konstruktionsfehler, sondern das Wesen dieser Leistung: Bürgergeld ist eine steuerfinanzierte Sozialleistung, keine beitragsfinanzierte Versicherung — genau wie Kindergeld oder Wohngeld. Der Zugang ist an Hilfebedürftigkeit und Aufenthaltsstatus geknüpft, verbunden mit Zugang zur Arbeitsvermittlung und Integrationskursen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/langzeitbezug/">Die bleiben doch alle jahrelang drin. Bürgergeld-Empfänger kommen da nie wieder raus!</a></dt>
          <dd>Der Anteil des Langzeitbezugs ist tatsächlich hoch: Rund 65 Prozent der erwerbsfähigen Leistungsberechtigten gelten als Langzeitbeziehende, fast 39 Prozent beziehen seit vier Jahren oder länger Bürgergeld. Das zeigt eine strukturelle Verfestigung, die ernst zu nehmen ist. Die Ursachen sind jedoch vielfältig: gesundheitliche Einschränkungen, fehlende Berufsqualifikationen, Betreuungspflichten oder regionale Arbeitslosigkeit. Ältere Beziehende (50–64 Jahre) haben mit 70 Monaten Medianverweildauer den schwersten Stand. Pauschale Unwilligkeit erklärt das nicht — aber die Zahlen zeigen auch, dass passive Leistungsgewährung allein keine Integration leistet.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/buergergeld/aufstocker/">Bürgergeld-Empfänger sind doch allesamt faul und wollen einfach nicht arbeiten!</a></dt>
          <dd>Rund 820.000 Bürgergeldbeziehende — etwa ein Fünftel aller erwerbsfähigen Leistungsberechtigten — gehen einer bezahlten Arbeit nach, verdienen aber zu wenig, um davon zu leben. Diese sogenannten ‚Aufstocker' sind überwiegend in Teilzeit oder geringfügig beschäftigt; nur rund 80.000 sind sozialversicherungspflichtig vollzeitbeschäftigt. Bürgergeld ist also nicht nur ein Instrument für Arbeitslose, sondern auch ein ergänzender Lohnzuschuss für Niedriglohnbeschäftigte.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/migration/">Migration &amp; Asyl: Zahlen, Argumente &amp; Fakten 2026</a></h3>
      <p>Werden wir überrannt? Sind Geflüchtete krimineller? Antworten zu Asylzahlen, Arbeitsmarkt, Kriminalität und Integration — Quellen BAMF, BKA und IAB.</p>
      <p>13 Fakten · 12 Argumente</p>
      <details>
        <summary>Argumente (12)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/zahlen-explodieren/">Die Asylzahlen explodieren immer weiter, wir werden überrannt!</a></dt>
          <dd>Tatsächlich sind die Asylerstanträge 2025 massiv gesunken: 113.236 Erstanträge – ein Rückgang von über 50 % im Vergleich zum Vorjahr (2024: 229.751). Im Januar 2026 setzte sich der Trend mit fast 49 % Rückgang fort. Von einer Explosion kann keine Rede sein – die Zahlen bewegen sich auf dem Niveau von 2020.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/leben-vom-buergergeld/">Die Flüchtlinge von 2015 leben alle nur vom Bürgergeld und arbeiten nicht.</a></dt>
          <dd>Die IAB-Daten zeigen etwas anderes: Ende 2024 lag die Beschäftigungsquote der 2015 zugezogenen Geflüchteten bei 64 % – nahe am Bevölkerungsdurchschnitt von 70 %. 84 % der abhängig Beschäftigten können ihren Lebensunterhalt ohne ergänzende Leistungen bestreiten. ‚Alle leben vom Bürgergeld' ist damit klar falsch.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/nehmen-jobs-weg/">Ausländer nehmen uns die guten Jobs weg.</a></dt>
          <dd>Die IAB-Daten zeigen, dass Geflüchtete vor allem in Gesundheits-, Verkehrs-/Logistik- und Fertigungsberufen arbeiten – Bereichen mit hohem Fachkräftemangel. Gleichzeitig sinkt die Zahl der Erwerbsfähigen bis Mitte der 2030er um 3,2 Millionen. Migration füllt also eher Lücken, als dass sie verdrängt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/krimineller-als-deutsche/">Ausländer sind krimineller als Deutsche, das zeigt doch die Kriminalstatistik!</a></dt>
          <dd>Die PKS 2024 zeigt tatsächlich eine Überrepräsentation: 35,4 % der Tatverdächtigen sind nichtdeutsch (ohne ausländerrechtliche Verstöße) bei ca. 15 % Bevölkerungsanteil. Allerdings benennt das BKA selbst die Erklärungsfaktoren: Nichtdeutsche sind überproportional jung und männlich (die Hochrisikogruppe in jeder Bevölkerung), leben häufiger in prekären Verhältnissen, und das Anzeigeverhalten gegenüber Fremden ist höher. Ein fairer Vergleich müsste diese Faktoren berücksichtigen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/kosten-migration/">Migration kostet uns nur Milliarden und bringt wirtschaftlich nichts!</a></dt>
          <dd>Die Kosten sind real: 2024 gab der Bund rund 28 Mrd. Euro im Kontext Flucht/Migration aus. Aber erstens ist das ca. 6 % des Bundeshaushalts. Zweitens zeigen die IAB-Daten, dass 64 % der 2015 zugezogenen Geflüchteten nach 9 Jahren erwerbstätig sind und Steuern sowie Sozialabgaben zahlen. Integrationsausgaben sind Investitionen mit zeitversetzter Rendite.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/ungebildet/">Die meisten Geflüchteten sind ungebildet und können hier gar nicht arbeiten.</a></dt>
          <dd>Rund die Hälfte der beschäftigten Geflüchteten arbeitet 7–8 Jahre nach Zuzug als Fachkraft oder Spezialist. 56 % der Integrationskursteilnehmer erreichen das Sprachniveau B1, über 88 % mindestens A2. Die Zahlen zeigen: Integration braucht Zeit, aber sie funktioniert – und zwar in qualifizierte Beschäftigung hinein.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/abschieben-statt-integrieren/">Man müsste einfach konsequent abschieben, dann wäre das Problem gelöst!</a></dt>
          <dd>2024 gab es 20.084 Abschiebungen (+22 % zum Vorjahr), aber 33.717 gescheiterte Abschiebeversuche (61,6 % Misserfolgsquote). Von den 220.808 Ausreisepflichtigen haben 178.500 eine Duldung, weil Abschiebung rechtlich oder tatsächlich unmöglich ist. ‚Einfach abschieben' scheitert nicht am politischen Willen, sondern an der Realität: fehlende Papiere, keine Rücknahmeabkommen, medizinische Hindernisse.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/alle-kommen-nach-deutschland/">Alle Flüchtlinge kommen nach Deutschland, kein anderes Land nimmt welche auf!</a></dt>
          <dd>Deutschland lag 2024 mit 229.695 Erstanträgen absolut auf Platz 1 in der EU. Pro Kopf sieht es anders aus: 2.752 Anträge pro 1 Mio. Einwohner vs. ca. 7.000 in Zypern. Anfang 2025 hat Frankreich Deutschland als Hauptzielland sogar abgelöst. Die EU verzeichnete 2024 insgesamt 911.960 Erstanträge – Deutschland trug 25 % davon.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/integration-funktioniert-nicht/">Integration funktioniert in Deutschland einfach nicht!</a></dt>
          <dd>Die Daten widersprechen dem: 64 % der 2015 zugezogenen Geflüchteten sind erwerbstätig (Durchschnitt: 70 %), 50 % arbeiten als Fachkräfte, 88 % der Kursteilnehmer erreichen mindestens A2-Deutschniveau, und 2024 gab es 291.955 Einbürgerungen (Rekord). Die durchschnittliche Aufenthaltsdauer bei Einbürgerung beträgt 11,8 Jahre – Integration ist ein Generationenprojekt, kein Sprint.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/fruher-ging-es-ohne/">Früher ging es auch ohne Einwanderung, warum brauchen wir die jetzt?</a></dt>
          <dd>Früher gab es sie auch: Die Gastarbeiter ab 1955, über 2,5 Mio. Aussiedler ab 1988 – Deutschland war immer ein Einwanderungsland, auch wenn es sich lange nicht so nannte. Und der demografische Wandel macht Zuwanderung heute noch dringender: Bis Mitte der 2030er sinkt die Zahl der Erwerbsfähigen um 3,2 Millionen – selbst bei hoher Nettozuwanderung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/einbuergerung-verschenkt/">Die Staatsbürgerschaft wird jetzt einfach verschenkt!</a></dt>
          <dd>2024 gab es 291.955 Einbürgerungen – ein Rekord, aber kein Verschenken: Die durchschnittliche Aufenthaltsdauer bei Einbürgerung lag bei 11,8 Jahren. Die Reform senkte den Mindestaufenthalt von 8 auf 5 Jahre, verlangt aber weiterhin Sprachkenntnisse, eigenständige Lebensunterhaltssicherung und ein Bekenntnis zur freiheitlich-demokratischen Grundordnung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/migration/brauchen-keine-fachkraefte/">Wir brauchen keine ausländischen Fachkräfte, es gibt genug Deutsche!</a></dt>
          <dd>Destatis-Prognosen zeigen: Bis Mitte der 2030er sinkt die Zahl der 20- bis 66-Jährigen um 3,2 Millionen – selbst bei hoher Nettozuwanderung. Schon jetzt sind in vielen Branchen (Pflege, Handwerk, IT, Gastronomie) Stellen unbesetzt. Ohne Zuwanderung wird sich der Fachkräftemangel massiv verschärfen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/teilzeit/">Teilzeit &amp; Arbeitsmoral: Arbeiten wir wirklich weniger?</a></h3>
      <p>Will die Gen Z nicht mehr arbeiten? Geht das Arbeitsvolumen zurück? Antworten zu Teilzeit, Care-Arbeit und Arbeitsstunden — Quellen IAB und Destatis.</p>
      <p>6 Fakten · 8 Argumente</p>
      <details>
        <summary>Argumente (8)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-1/">Die Leute wollen heute alle nur noch in Teilzeit arbeiten und ihre Freizeit genießen.</a></dt>
          <dd>Es stimmt, dass der Wunsch nach mehr Freizeit der häufigste Einzelgrund für Teilzeit ist (27,9 %). Allerdings arbeiten fast genauso viele (23,5 %) in Teilzeit, weil sie Care-Arbeit leisten — also Kinder betreuen oder Angehörige pflegen. Bei Frauen liegen beide Gründe nahezu gleichauf (28,9 % vs. 28,8 %). Und nur 4,8 % der Teilzeitbeschäftigten geben an, keine Vollzeitstelle gefunden zu haben. Wer Teilzeit pauschal als Faulheit abtut, übersieht die vielfältigen Gründe.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-2/">Wegen der ganzen Teilzeit geht in Deutschland die Arbeitsleistung zurück.</a></dt>
          <dd>Die durchschnittliche Arbeitszeit pro Kopf sinkt tatsächlich leicht — 2025 lag sie bei 1.332 Stunden pro Erwerbstätigem. Gleichzeitig hat die Zahl der Erwerbstätigen mit 45,98 Millionen fast ein Rekordhoch erreicht, sodass das Gesamtarbeitsvolumen bei 61,26 Milliarden Stunden lag — nur 0,2 % unter dem Vorjahr. In der Summe arbeitet Deutschland also nahezu gleich viel.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-3/">Die Gen Z ist arbeitsscheu und will nicht mehr richtig arbeiten.</a></dt>
          <dd>Die Daten des IAB zeigen ein anderes Bild: Die Erwerbsbeteiligung der 20- bis 24-Jährigen stieg seit 2015 um über 6 Prozentpunkte auf 76 %. Der Teilzeitanstieg in dieser Gruppe erklärt sich vor allem durch mehr arbeitende Studierende: Deren Erwerbsquote stieg von 36,7 % (2015) auf 56,0 % (2023). Dass junge Menschen andere Vorstellungen von Arbeit haben — etwa flexible Arbeitszeiten oder Homeoffice — bedeutet nicht, dass sie weniger arbeiten wollen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-4/">Die jungen Leute machen alle nur noch Teilzeit, weil sie keine Lust auf 40 Stunden haben.</a></dt>
          <dd>Der Anstieg der Teilzeit bei jungen Menschen hängt laut IAB zu großen Teilen mit mehr erwerbstätigen Studierenden zusammen. Die Erwerbsquote von Studierenden im Alter von 20 bis 24 Jahren stieg zwischen 2015 und 2023 um 19,3 Prozentpunkte auf 56,0 %. Studierende arbeiten zwangsläufig in Teilzeit — das sagt nichts über ihre Arbeitsmoral nach dem Studium aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-5/">Wenn wir die Teilzeit abschaffen, haben wir keinen Fachkräftemangel mehr.</a></dt>
          <dd>Die Idee klingt einfach, geht aber an der Realität vorbei. Teilzeit hängt häufig mit Betreuungspflichten (23,5 %), Aus- und Weiterbildung (11,6 %) oder Krankheit bzw. Behinderung (4,9 %) zusammen. Ein pauschales Abschaffen beseitigt diese Gründe nicht — es würde eher dazu führen, dass Menschen ganz aus dem Arbeitsmarkt ausscheiden. Kritiker weisen zurecht darauf hin, dass bessere Kinderbetreuung und flexiblere Arbeitsmodelle wirksamer wären.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-6/">Teilzeit ist doch ein reines Frauenproblem.</a></dt>
          <dd>Frauen arbeiten tatsächlich deutlich häufiger in Teilzeit als Männer (49 % vs. 12 % im Jahr 2024). Aber auch bei Männern hat sich die Quote seit 2005 von 7 % auf 12 % fast verdoppelt. Zudem betrifft Teilzeit die gesamte Gesellschaft: Die hohe Teilzeitquote von Müttern (68 %) hängt eng mit dem Mangel an Betreuungsplätzen zusammen — einem strukturellen Problem, das nicht nur Frauen betrifft.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-7/">In anderen Ländern wird viel mehr gearbeitet als bei uns.</a></dt>
          <dd>Deutschlands Teilzeitquote von 29 % liegt zwar über dem EU-Durchschnitt von 18 %. Allerdings haben nur die Niederlande (43 %) und Österreich (31 %) höhere Quoten — und gerade die Niederlande haben gleichzeitig die höchste Frauenerwerbstätigenquote der EU. Hohe Teilzeitquoten gehen oft mit hoher Erwerbsbeteiligung einher: Mehr Menschen arbeiten, aber manche eben weniger Stunden. Länder mit niedrigen Teilzeitquoten haben häufig auch eine geringere Erwerbsbeteiligung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/teilzeit/arg-8/">Wer Teilzeit arbeitet, ist selbst schuld, wenn die Rente nicht reicht.</a></dt>
          <dd>Der Gender Pension Gap von 27,1 % (2023) zeigt, dass Frauen im Schnitt gut ein Viertel weniger eigene Alterssicherungsleistungen erhalten als Männer — unter anderem weil 68 % der Mütter in Teilzeit arbeiten, oft aufgrund fehlender Betreuungsmöglichkeiten. Die Entscheidung für Teilzeit ist in vielen Fällen keine freie Wahl, sondern Ergebnis struktureller Rahmenbedingungen. Positiv: Der Pension Gap wird für jüngere Generationen kleiner, weil sich Erwerbsbiografien angleichen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/">Vegan vs. Fleisch: Klima, Gesundheit, Argumente — Fakten</a></h3>
      <p>Wird für Tofu Regenwald gerodet? Haben Veganer B12-Mangel? Antworten zu Klima, Gesundheit, Pflanzenmilch und Antibiotika — Quellen DGE, FAO und UBA.</p>
      <p>7 Fakten · 8 Argumente</p>
      <details>
        <summary>Argumente (8)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/regenwald-soja/">Für das Soja im Tofu der Veganer wird der Regenwald abgeholzt!</a></dt>
          <dd>Das ist ein Mythos. Rund 77 % der weltweiten Sojaernte gehen ins Tierfutter. Nur ein kleiner Teil wird direkt für Lebensmittel wie Tofu oder Sojamilch genutzt. Viele Hersteller für den deutschen Markt beziehen ihr Soja aus der EU, teils auch aus Nordamerika und China. Wer den Regenwald schützen will, sollte deshalb vor allem weniger Tierfutter-Soja nachfragen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/naehrstoffmangel/">Veganer haben doch alle Nährstoffmangel, besonders bei Protein und Vitamin B12.</a></dt>
          <dd>Bei ausreichender Energiezufuhr und geeigneter Kombination pflanzlicher Proteinquellen kann der Proteinbedarf gedeckt werden. Vitamin B12 muss bei veganer Ernährung tatsächlich supplementiert werden. Genau deshalb ist eine gut geplante vegane Ernährung wichtig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/natuerlich-fleisch/">Der Mensch ist ein Allesfresser, wir haben schon immer Fleisch gegessen.</a></dt>
          <dd>Dass wir Fleisch essen können, bedeutet nicht, dass wir es in heutigen Mengen brauchen. Der Fleischverzehr in Deutschland lag 2024 bei 53,2 kg pro Kopf — die DGE empfiehlt maximal 300–600 g pro Woche, also 15–31 kg pro Jahr. Wir essen das 2- bis 3,5-Fache des empfohlenen Maximums. Ein hoher Konsum tierischer Produkte wird mit gesundheitlichen Risiken wie Herz-Kreislauf-Erkrankungen und bestimmten Krebsarten in Verbindung gebracht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/mandelmilch-wasser/">Pflanzenmilch wie Mandelmilch verbraucht doch auch extrem viel Wasser!</a></dt>
          <dd>Mandelmilch benötigt tatsächlich rund 371 Liter Wasser pro Liter — das ist viel. Aber Kuhmilch liegt mit 628 Litern pro Liter noch deutlich darüber. Wer Wasser- und Klimabilanz optimieren will, greift zu Hafermilch (48 L) oder Sojamilch (28 L). Beide schneiden in allen Umweltkategorien drastisch besser ab als Kuhmilch.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/teurer-lifestyle/">Veganismus ist nur ein teurer Lifestyle für privilegierte Großstädter.</a></dt>
          <dd>Vegane Grundnahrungsmittel wie Reis, Kartoffeln, Nudeln, Linsen, Bohnen, Haferflocken und saisonales Gemüse gehören zu den günstigsten Lebensmitteln überhaupt. Teuer sind vor allem hochverarbeitete Ersatzprodukte, die für eine ausgewogene pflanzliche Ernährung nicht zwingend nötig sind.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/bauern-existenz/">Wenn alle vegan werden, verlieren unsere Landwirte ihre Existenz!</a></dt>
          <dd>Ein Wandel der Ernährungsgewohnheiten passiert nicht über Nacht, sondern über Jahre und Jahrzehnte. Das gibt der Landwirtschaft Zeit, sich anzupassen. Der Anbau pflanzlicher Proteine für den direkten menschlichen Verzehr kann neue Marktchancen schaffen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/antibiotika-resistenz/">Was hat mein Fleischkonsum mit Antibiotikaresistenzen zu tun?</a></dt>
          <dd>2024 gingen 562 Tonnen Antibiotika in die deutsche Tierhaltung. Der massenhafte Einsatz fördert die Entstehung resistenter Keime, die über Lebensmittel, Gülle und Abwasser auch den Menschen erreichen. Die WHO warnt, dass Antibiotikaresistenzen eine der größten Gesundheitsbedrohungen des 21. Jahrhunderts sind. Weniger Massentierhaltung bedeutet weniger Antibiotikaeinsatz.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vegane-ernaehrung/einzelner-beitrag/">Was bringt es, wenn ich alleine auf Fleisch verzichte? Das ändert doch nichts!</a></dt>
          <dd>Die EAT-Lancet-Kommission zeigt: Wenn viele Menschen ihre Ernährung umstellen, könnten weltweit 11,1 Millionen vorzeitige Todesfälle pro Jahr verhindert werden. In Deutschland kaufen bereits 39 % der Verbraucher regelmäßig vegetarische oder vegane Alternativen — Tendenz steigend. Jede Kaufentscheidung sendet ein Marktsignal. Allein der Wechsel von Kuhmilch zu Hafermilch spart pro Liter über 90 % CO₂ ein.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/">Vermögens- &amp; Erbschaftsteuer: Argumente, Fakten, Daten</a></h3>
      <p>Wandern Reiche ab? Zerstört das den Mittelstand? Antworten zu Vermögensverteilung, OECD-Vergleich und Aufkommen mit Quellen vom DIW und BMF.</p>
      <p>7 Fakten · 11 Argumente</p>
      <details>
        <summary>Argumente (11)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/hochsteuerland/">Wir sind sowieso schon Hochsteuerland, eine Vermögenssteuer macht uns kaputt!</a></dt>
          <dd>Bei Steuern und Abgaben auf Arbeit liegt Deutschland hoch. Bei den vermögensbezogenen Steuern liegt Deutschland mit rund 1 % des BIP dagegen klar unter dem OECD-Durchschnitt von 1,9 %. Viele internationale Vergleiche zeigen: Eine stärkere Besteuerung großer Vermögen kann helfen, Arbeitseinkommen im Gegenzug weniger stark zu belasten.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/neidsteuer/">Das ist doch reine Neidsteuer! Typisch deutsche Neidgesellschaft!</a></dt>
          <dd>Es geht nicht um Neid, sondern um Chancengerechtigkeit. Ein großer Teil sehr großer Vermögen wird geerbt, nicht neu aufgebaut. Wenn Vermögenskonzentration über Generationen hinweg zunimmt und große Erbschaften steuerlich stark privilegiert werden, ist das eine Frage der fairen Verteilung von Chancen. Vermögensteuern oder strengere Erbschaftsteuern sind deshalb kein exotischer Sonderweg.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/familienunternehmen/">Eine Vermögenssteuer zerstört unsere Familienunternehmen und den Mittelstand!</a></dt>
          <dd>Seriöse Modelle arbeiten mit hohen Freibeträgen und zielen auf sehr große Vermögen. Die besonders großzügigen Privilegien im Erbschaftsteuerrecht kommen heute vor allem bei sehr großen Unternehmensvermögen zum Tragen, nicht bei typischen kleinen Betrieben. Entscheidend ist daher die Ausgestaltung: Kleine und mittlere Betriebe lassen sich schützen, ohne milliardenschwere Übertragungen pauschal zu verschonen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/abwanderung/">Die Reichen wandern dann einfach ins Ausland ab!</a></dt>
          <dd>Abwanderungsrisiken gibt es, aber sie werden oft überschätzt. Wohnsitzentscheidungen hängen nicht nur von einer Steuer ab, sondern auch von Unternehmen, Familie, Infrastruktur und Rechtssicherheit. Zudem kann der Gesetzgeber Wegzugs- und Missbrauchsregeln so ausgestalten, dass reine Steuergestaltung erschwert wird.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/doppelbesteuerung/">Es wird doch schon alles bei der Einkommensteuer versteuert (Doppelbesteuerung)!</a></dt>
          <dd>Vermögen wächst oft ohne Einkommensteuerzahlung — durch Wertsteigerungen von Immobilien, Aktien oder Unternehmensanteilen. Diese unrealisierten Gewinne werden erst bei Verkauf besteuert, bei Erbschaften oft gar nicht. Zudem: Auch die Mehrwertsteuer ist eine 'Doppelbesteuerung' von bereits versteuertem Einkommen. Das Leistungsfähigkeitsprinzip erlaubt mehrere Steuern auf verschiedene Bemessungsgrundlagen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/substanzbesteuerung/">Eine Vermögensteuer geht an die Substanz — das zerstört Unternehmen!</a></dt>
          <dd>Nicht das Unternehmen zahlt, sondern der Eigentümer. Bei einem Steuersatz von 1 % und typischen Kapitalrenditen von 5–10 % lässt sich die Steuer bequem aus den laufenden Erträgen bezahlen. Bei der Erbschaftsteuer ist zudem eine Stundung über 15 Jahre möglich — das entspricht etwa 1–2 % des jährlichen Unternehmensgewinns. Wer ein Unternehmen kauft, muss den vollen Preis sofort aufbringen — nur Erben bekommen Sonderkonditionen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/elternhaus/">Die Erbschaftsteuer zwingt Erben dazu, ihr Elternhaus zu verkaufen!</a></dt>
          <dd>Für das Familienheim gibt es weitreichende Ausnahmen: Wer das geerbte Haus selbst für mindestens 10 Jahre bewohnt, zahlt darauf null Euro Erbschaftsteuer (bis 200 m² Wohnfläche). Zudem gibt es hohe persönliche Freibeträge: 400.000 € pro Kind, 500.000 € für Ehepartner — alle 10 Jahre erneuerbar. 96 % aller Erbfälle fallen komplett unter die Freibeträge. Das 'Elternhaus'-Argument schützt in Wahrheit die Villen der Superreichen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/verwaltungskosten/">Die Erhebung einer Vermögenssteuer kostet mehr, als sie einbringt!</a></dt>
          <dd>Das Verwaltungsargument ist heute schwächer als in den 1990ern. Durch Digitalisierung, Informationsaustausch und die reformierte Immobilienbewertung sind die Voraussetzungen deutlich besser. Entscheidend ist aber auch hier das Design: hohe Freibeträge und klare Bewertungsregeln halten den Aufwand beherrschbar.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/leistung-erbe/">Erbschaftsteuer bestraft Leistung und zerstört Lebenswerke!</a></dt>
          <dd>Erben ist keine eigene Leistung. Gleichzeitig werden große Unternehmensvermögen im geltenden Recht oft weit stärker geschont als normale Erbschaften. Dadurch wird Vermögenskonzentration über Generationen eher verstärkt als abgemildert. Wer kleine und mittlere Erbschaften schützen will, kann Freibeträge hoch halten und Privilegien an der Spitze gezielter abbauen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/investitionen-flucht/">Investitionen fließen ab und Firmen gehen ins Ausland!</a></dt>
          <dd>Standortentscheidungen hängen von vielen Faktoren ab: Fachkräfte, Infrastruktur, Rechtssicherheit, Absatzmärkte und Energiekosten. Eine Vermögensteuer allein entscheidet selten über Investitionen. Wichtig ist daher, sehr große private Vermögen zu adressieren, ohne produktive Unternehmensinvestitionen unnötig zu belasten.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/vermoegenssteuer/privatsache/">Erben ist Privatsache — der Staat hat da nichts zu suchen!</a></dt>
          <dd>Art. 14 GG garantiert Eigentum, betont aber auch dessen Sozialpflichtigkeit. Große Erbschaften entstehen nicht losgelöst von staatlich finanzierter Infrastruktur, Bildung und Rechtssicherheit. Deshalb ist ihre Besteuerung keine unzulässige Einmischung, sondern Teil legitimer Verteilungspolitik in einem Sozialstaat.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/">Gleichberechtigung: Pay Gap, Care, Rente — Argumente &amp; Daten</a></h3>
      <p>Verdienen Frauen freiwillig weniger? Ist Feminismus überflüssig? Antworten zu Pay Gap, Care, Altersarmut und Gewalt — Daten aus Destatis und BKA.</p>
      <p>9 Fakten · 13 Argumente</p>
      <details>
        <summary>Argumente (13)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/berufswahl/">Frauen verdienen nur deshalb weniger, weil sie sich freiwillig für schlechter bezahlte soziale Berufe entscheiden.</a></dt>
          <dd>Branche und Beruf erklären einen Teil der Verdienstlücke. Aber selbst wenn Qualifikation, Tätigkeit, Erwerbsbiografie und Teilzeit berücksichtigt werden, bleibt 2025 ein bereinigter Gender Pay Gap von 6 %. Außerdem ist die Frage, warum „weibliche“ Berufe wie Pflege oder Erziehung so schlecht bezahlt sind, selbst ein Teil des Problems — ihre gesellschaftliche Bedeutung steht in keinem Verhältnis zur Vergütung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/fuehrung/">Frauen wollen gar keine Führungspositionen übernehmen, weil ihnen die Familie wichtiger ist.</a></dt>
          <dd>In Deutschland sind nur 29,1 % der Führungskräfte weiblich — deutlich weniger als im EU-Durchschnitt (35,2 %). Die Unterrepräsentation liegt nicht am mangelnden Willen: 47,4 % der erwerbstätigen Frauen arbeiten in Teilzeit, überwiegend wegen Care-Arbeit. Wenn Frauen den Großteil der unbezahlten Arbeit leisten (Care Gap: 43,4 %), bleibt weniger Zeit für die Karriereleiter — das ist keine freie Wahl, sondern ein strukturelles Problem.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gleichberechtigung-erreicht/">Die Gleichberechtigung ist doch längst erreicht, Frauen haben heute genau die gleichen Möglichkeiten wie Männer.</a></dt>
          <dd>Gesetzlich sind Frauen gleichgestellt, faktisch gibt es weiterhin erhebliche Lücken: 16 % Pay Gap, 43,4 % Care Gap, 27,1 % Pension Gap. Frauen ab 65 sind häufiger armutsgefährdet (21,4 % vs. 17,0 % bei Männern). Im aktuellen Bundestag ist der Frauenanteil auf 32,4 % gesunken. Und 2024 wurden 132 Frauen durch ihre Partner oder Ex-Partner getötet. Gleichberechtigung auf dem Papier ist nicht Gleichberechtigung im Alltag.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/teilzeit/">Männer arbeiten dafür mehr in Vollzeit und machen die harten Überstunden.</a></dt>
          <dd>Wenn man bezahlte und unbezahlte Arbeit zusammenrechnet, arbeiten Frauen sogar etwas mehr: 45:33 Stunden pro Woche vs. 44:23 bei Männern (Destatis). Der Unterschied ist, dass Frauenarbeit zu einem großen Teil unsichtbar und unbezahlt bleibt — Kinderbetreuung, Pflege, Haushalt. Diese Arbeit hat keine Überstundenzuschläge, keinen Renteneintrag und keinen Aufstieg.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/quote/">Eine Frauenquote führt nur dazu, dass unqualifizierte Frauen bevorzugt werden und fähige Männer das Nachsehen haben.</a></dt>
          <dd>Frauen stellen 53 % der Hochschulabsolventen, aber nur 29,1 % der Führungskräfte — das Qualifikationsargument steht also auf wackligen Beinen. Die Quote setzt dort an, wo nachweislich qualifizierte Frauen bei der Besetzung übergangen werden. Die eigentliche Frage ist nicht, ob es ein Problem gibt (das belegen die Zahlen), sondern welche Instrumente es wirksam und fair verringern.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/pension-gap-arg/">Frauen bekommen weniger Rente, weil sie halt weniger gearbeitet haben — selbst schuld.</a></dt>
          <dd>Männer erhalten im Schnitt 1.405 € Altersrente pro Monat, Frauen nur 955 € — 450 € weniger, jeden Monat. Auf 20 Rentenjahre sind das über 100.000 € Differenz. Dahinter stehen nicht individuelle Entscheidungen, sondern strukturelle Ursachen: Der Care Gap von 43,4 % zeigt, dass Frauen den Großteil der gesellschaftlich notwendigen Sorgearbeit übernehmen. Ohne Kinderbetreuung, Pflege und Haushalt würde die Wirtschaft stillstehen — das Rentensystem bestraft diese Leistung trotzdem.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/child-penalty/">Kinder sind eine freiwillige Entscheidung, dann muss man halt mit den Konsequenzen leben.</a></dt>
          <dd>Kinder sind eine gesellschaftliche Notwendigkeit — ohne Nachwuchs kein Rentensystem, keine Fachkräfte, keine Zukunft. Die ZEW-Studie zeigt, dass Mütter im vierten Jahr nach der ersten Geburt fast 30.000 Euro weniger verdienen als vergleichbare Frauen ohne Kinder. Bei Vätern gibt es keinen solchen Einschnitt. Es geht also nicht um die Entscheidung für Kinder, sondern darum, dass die Konsequenzen fast ausschließlich Mütter treffen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gewalt-privatsache/">Häusliche Gewalt ist Privatsache, da soll sich der Staat raushalten.</a></dt>
          <dd>2024 wurden in Deutschland 265.942 Opfer häuslicher Gewalt polizeilich erfasst, über 70 % davon Frauen. 132 Frauen wurden durch ihren Partner oder Ex-Partner getötet — im Schnitt alle drei Tage eine. Das ist kein Privatproblem, sondern ein Straftatbestand und ein gravierendes gesellschaftliches Problem. Die Dunkelziffer liegt laut Studien deutlich höher als die erfassten Fälle.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/dunkelziffer/">Die Zahlen zu häuslicher Gewalt sind doch aufgebauscht — so schlimm kann es nicht sein.</a></dt>
          <dd>Im Gegenteil: Die polizeilichen Zahlen (265.942 Opfer, 2024) bilden nur die Spitze des Eisbergs. Die LeSuBiA-Dunkelfeldstudie des BKA zeigt, dass die Anzeigequote bei häuslicher Gewalt unter 5 % liegt — 19 von 20 Taten werden nie angezeigt. Tatsächlich erleben 18 % aller Frauen in Deutschland häusliche Gewalt. Die Gründe für Nicht-Anzeigen: Angst, Scham, emotionale und finanzielle Abhängigkeit. Die offiziellen Zahlen unterschätzen das Problem also massiv.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/maenner-benachteiligt/">Heutzutage werden eher Männer benachteiligt — im Familienrecht, bei Sorgerecht, überall.</a></dt>
          <dd>Männer haben tatsächlich Nachteile in bestimmten Bereichen — etwa bei der Lebenserwartung (4,7 Jahre weniger), psychischer Gesundheit (höhere Suizidrate) oder gesellschaftlichem Druck. Diese Probleme sind real und ernst zu nehmen. Aber sie heben die systematische Benachteiligung von Frauen bei Einkommen (16 % Pay Gap), Rente (39,4 % Pension Gap), Vermögen und körperlicher Sicherheit (132 Femizide 2024) nicht auf. Gleichberechtigung bedeutet, beide Seiten zu sehen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/feminismus-uebertrieben/">Feminismus ist in Deutschland nicht mehr nötig, das ist doch übertrieben.</a></dt>
          <dd>Bis 1977 durften Frauen in Deutschland nicht ohne Erlaubnis des Ehemanns arbeiten. Vergewaltigung in der Ehe war bis 1997 legal. Heute, 2025, verdienen Frauen 16 % weniger, bekommen 39,4 % weniger eigene Rente und alle drei Tage wird eine Frau durch ihren Partner getötet. Im Bundestag liegt der Frauenanteil bei 32,4 % — und ist gerade gesunken. Ob man das „Feminismus“ nennt oder nicht: Der Handlungsbedarf ist durch Zahlen belegt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/gleiche-bildung/">Frauen sind doch mittlerweile besser gebildet als Männer, dann müssten sie ja auch mehr verdienen.</a></dt>
          <dd>Stimmt: 53 % der Hochschulabschlüsse gehen an Frauen, 54 % der Abiturienten sind weiblich. Trotzdem sind nur 29,1 % der Führungskräfte und 28 % der Professoren Frauen. Diese 'Leaky Pipeline' zeigt, dass Bildungserfolg allein nicht reicht — strukturelle Barrieren, Care-Verantwortung und Teilzeitfallen sorgen dafür, dass die Qualifikation nicht in entsprechende Positionen und Gehälter mündet.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gleichberechtigung/eu-vergleich-arg/">Deutschland steht bei der Gleichberechtigung doch gut da im Vergleich zu anderen Ländern.</a></dt>
          <dd>Im WEF-Ranking liegt Deutschland auf Platz 7 — das klingt gut, verdeckt aber die Schwächen. Beim Gender Pay Gap gehört Deutschland mit 16 % zu den Schlusslichtern der EU (Durchschnitt: 12,7 %). Nur Estland, Österreich und Tschechien schneiden schlechter ab. Bei wirtschaftlicher Teilhabe und politischer Repräsentation liegt Deutschland deutlich hinter Skandinavien. Der 7. Platz kommt vor allem durch gute Werte bei Bildung und Gesundheit zustande.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/bildung/">Bildungssystem Deutschland: PISA, Lehrermangel, Argumente</a></h3>
      <p>Lehrer arbeiten halbtags? Schüler werden dümmer? Antworten zu Bildungsausgaben, PISA-Studie und Lehrkräftemangel mit Quellen aus OECD, KMK und Destatis.</p>
      <p>6 Fakten · 8 Argumente</p>
      <details>
        <summary>Argumente (8)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/weltspitze/">Unser Bildungssystem war mal Weltspitze</a></dt>
          <dd>Deutschland hatte tatsächlich ein international angesehenes Bildungssystem – vor allem in der beruflichen Bildung (duales System). Aber bei PISA 2022 erreichten deutsche 15-Jährige in Mathematik nur noch 475 Punkte – ein historischer Tiefstand und ein Rückgang von 25 Punkten gegenüber 2018. Rund ein Drittel hat in mindestens einem Bereich nur minimale Kompetenzen. Statt sich auf vergangenen Ruhm zu berufen, braucht es massive Investitionen: Deutschland liegt mit 4,5 % des BIP für Bildung deutlich unter dem OECD-Schnitt von 5,1 % und weit hinter Skandinavien (6,5–7,1 %).</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/halbtags/">Die Lehrer arbeiten doch nur halbtags und haben ständig Ferien</a></dt>
          <dd>Eine repräsentative Studie des Prognos-Instituts in Sachsen zeigt: In Schulwochen fallen Mehrstunden an. Im Jahresmittel lagen Vollzeit-Lehrkräfte etwa auf ihrem individuellen Soll, Teilzeitkräfte aber 5,8 % darüber. Unterricht ist dabei nur ein Teil der Arbeitszeit – hinzu kommen Vor- und Nachbereitung, Korrekturen, Elterngespräche, Verwaltung und Konferenzen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/verbloedung/">Schüler können heute nichts mehr, die sind alle verblödet</a></dt>
          <dd>Die PISA-Ergebnisse zeigen tatsächlich einen deutlichen Leistungsrückgang, der aber strukturelle Ursachen hat – und keine individuelle 'Verblödung'. Zu den Ursachen gehören chronische Unterfinanzierung (Deutschland liegt unter dem OECD-Schnitt), akuter Lehrkräftemangel (35.000 fehlend), pandemiebedingte Lernrückstände und der stärkste Zusammenhang zwischen sozialer Herkunft und Bildungserfolg in der OECD. Die Lösung liegt nicht bei den Schüler:innen, sondern beim System: bessere Ausstattung, mehr Personal, gezielte Förderung Benachteiligter.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/laendersache/">Bildung ist Ländersache, da kann man nichts machen</a></dt>
          <dd>Das stimmt verfassungsrechtlich – aber es ist kein Naturgesetz. Das Kooperationsverbot von 2006 verhindert, dass der Bund direkt in Schulen investiert. Das Ergebnis: 16 verschiedene Lehrpläne, massive Qualitätsunterschiede zwischen den Bundesländern und ein 'Bildungsflickenteppich'. Mehrere Bundesländer fordern inzwischen selbst die Aufhebung dieses Verbots. Auch der DigitalPakt Schule zeigt, dass Bund-Länder-Kooperation in der Bildung möglich ist – er wurde trotz Kooperationsverbot realisiert. 'Ländersache' heißt nicht 'unveränderbar'.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/genug-geld/">Wir geben genug Geld für Bildung aus</a></dt>
          <dd>198 Milliarden Euro klingen nach viel. Aber gemessen am BIP gibt Deutschland nur 4,5 % aus — unter dem OECD-Schnitt von 5,1 %. Die Differenz entspricht rund 25 Mrd. Euro pro Jahr oder ~1.600 € mehr pro Schüler/Kitakind. Zum Vergleich: Schweden investiert 7,1 % des BIP. Die Konsequenzen sieht man: marode Schulgebäude, 35.000 fehlende Lehrkräfte und 100.000 fehlende Erzieher.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/hauptschule/">Hauptschüler sind halt einfach nicht so schlau</a></dt>
          <dd>Das ist ein klassischer Zirkelschluss. PISA zeigt seit Jahren, dass Deutschland zu den OECD-Ländern mit stark ausgeprägten sozialen Bildungsungleichheiten gehört. Kinder aus bildungsfernen Familien werden überproportional auf niedrigere Schulformen verteilt. Das spricht nicht für mangelnde Intelligenz, sondern für strukturelle Probleme wie frühe Selektion, ungleiche Förderung und zu wenig Unterstützung benachteiligter Kinder.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/inklusion/">Inklusion schadet normalen Schülern</a></dt>
          <dd>Die umfassendste deutsche Studie zur Inklusion (INSIDE, 2016–2025, über 4.000 Schüler:innen an 246 Schulen) zeigt: Inklusion 'gelingt weder durchweg noch scheitert grundsätzlich'. Entscheidend sind die Rahmenbedingungen – insbesondere gute Kooperation zwischen Regel- und Sonderpädagogen sowie ausreichend Personal. Die Studie zeigt keine generellen Nachteile für Mitschüler:innen ohne Förderbedarf. Problematisch wird es erst, wenn Inklusion ohne zusätzliche Ressourcen umgesetzt wird. Das Problem ist also nicht die Inklusion an sich, sondern ihre unzureichende Ausstattung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/digitalisierung/">Digitalisierung an Schulen bringt nichts, Kinder sollen lesen lernen</a></dt>
          <dd>Digitale Kompetenz und Lesen lernen sind kein Widerspruch – beides gehört zu den Grundkompetenzen des 21. Jahrhunderts. Der DigitalPakt Schule hat Milliarden in Infrastruktur gebunden. Das Problem war nie 'ob', sondern 'wie': Tablets allein verbessern keinen Unterricht. Es braucht pädagogische Konzepte, geschulte Lehrkräfte und IT-Support. Seit 2025 liegt bereits ein Zwischenbericht zur Evaluation vor; der DigitalPakt 2.0 soll stärker auf Qualität statt nur auf Hardware setzen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gesundheit/">Gesundheitssystem Deutschland: Kosten, Pflege, Argumente</a></h3>
      <p>Bestes System der Welt? Bald pleite? Antworten zu Beitragssatz, Zwei-Klassen-Medizin, Pflegenotstand und ePA mit Quellen aus GKV-SV, BMG und OECD.</p>
      <p>10 Fakten · 12 Argumente</p>
      <details>
        <summary>Argumente (12)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/bestes-system/">Wir haben das beste Gesundheitssystem der Welt</a></dt>
          <dd>Deutschland hat echte Stärken: universelle Absicherung, kurze Wartezeiten für Notfallversorgung und schnellen Zugang zu neuen Medikamenten. Gleichzeitig belegen Daten erhebliche Zugangsunterschiede zwischen GKV und PKV, einen akuten Pflegenotstand, strukturelle Überkapazitäten im Krankenhausbereich und einen der niedrigsten Präventionsanteile im OECD-Vergleich. 'Bestes System der Welt' ist daher eine pauschale Übertreibung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/beitraege-hoch/">Die Krankenkassenbeiträge sind viel zu hoch</a></dt>
          <dd>Der GKV-Gesamtbeitrag liegt 2026 bei 17,5 % des Bruttogehalts und wird paritätisch geteilt, d. h. der Arbeitnehmer-Anteil beträgt ca. 8,75 %. Zum Vergleich: In Frankreich liegt der Arbeitnehmer-Anteil bei rund 7 %, in den Niederlanden bei ca. 5,5 % – der deutsche Wert ist also hoch, aber kein extremer Ausreißer im OECD-Vergleich. Das eigentliche Problem ist weniger die Höhe als die Effizienz: Deutschland gibt sehr viel aus, hat strukturelle Überkapazitäten im Krankenhausbereich und investiert vergleichsweise wenig in Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/jeder-versorgt/">Jeder bekommt in Deutschland die medizinische Versorgung, die er braucht</a></dt>
          <dd>Formal ist der Zugang breit, aber in der Praxis gibt es spürbare Versorgungslücken. Viele gesetzlich Versicherte berichten über lange Wartezeiten auf Facharzttermine, hinzu kommen Engpässe in Pflege und psychischer Versorgung sowie regionale Unterschiede.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/auslaender-gesundheit/">Ausländer belasten unser Gesundheitssystem</a></dt>
          <dd>Es kommt auf die Gruppe an: Erwerbsmigrant:innen sowie EU-Bürger:innen zahlen Beiträge wie alle anderen GKV-Mitglieder auch – und nehmen statistisch im Schnitt weniger Leistungen in Anspruch als die ältere inländische Bevölkerung, weil sie jünger und erwerbstätig sind. Für Asylsuchende gilt zunächst nur ein eingeschränkter Leistungsumfang (AsylbLG: akute Erkrankungen, Schmerzen, Schwangerschaft, Impfungen); erst nach 36 Monaten ist der Leistungsumfang deutlich erweitert. Die Haupttreiber der Finanzierungsprobleme sind strukturell: steigende Ausgaben durch die alternde Bevölkerung, Überkapazitäten im Krankenhausbereich und zu wenig Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/psychisch-einbildung/">Psychische Krankheiten sind nur Einbildung / Modeerscheinung</a></dt>
          <dd>Psychische Erkrankungen sind medizinisch genauso real wie körperliche – das ist wissenschaftlicher Konsens. Ein Teil des statistischen Anstiegs erklärt sich durch breiteres Bewusstsein und erweiterte Diagnosekriterien; die zugrundeliegenden Erkrankungen sind dadurch aber nicht weniger behandlungsbedürftig. Im ersten Halbjahr 2025 stiegen die Fallzahlen in Psychotherapie und Psychiatrie weiter um 3,4 %, in der Kinder- und Jugendpsychiatrie sogar um 5,7 %. Die Versorgung hinkt dem Bedarf seit Jahren hinterher.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/homoeopathie/">Homöopathie/Alternativmedizin sollte von der Kasse bezahlt werden</a></dt>
          <dd>Für Homöopathie gibt es keine robuste, reproduzierbare Evidenz eines Nutzens über Placebo hinaus. Der Gesetzgeber hat 2023 mit dem GKV-Finanzstabilisierungsgesetz die Möglichkeit der Krankenkassen gestrichen, Homöopathie als freiwillige Satzungsleistung zu erstatten – begründet mit dem fehlenden Nachweis des Nutzens. In einem System mit konkreten Engpässen bei Pflege, Psychotherapie und Prävention ist die Mittelverwendung nach Evidenz ein nachvollziehbares Prinzip.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/zu-viele-krankenhaeuser/">Es gibt zu viele Krankenhäuser</a></dt>
          <dd>Da ist tatsächlich etwas dran: Deutschland hat viele Krankenhausbetten und eine vergleichsweise niedrige Bettenauslastung. Aber 'weniger' heißt nicht automatisch 'besser'. Es braucht Spezialisierung, Vernetzung und gleichzeitig Erreichbarkeit – besonders in ländlichen Regionen. Genau diesen Spagat versucht die Krankenhausreform.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/pharma/">Die Pharmaindustrie macht uns absichtlich krank</a></dt>
          <dd>Arzneimittel unterliegen in der EU einem regulierten Zulassungs- und Bewertungsverfahren. Berechtigte Kritik betrifft eher Preise, Transparenz und Fehlanreize als eine belegte Absicht, Menschen krank zu machen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/aerztemangel-landleben/">Auf dem Land gibt es keine Ärzte mehr</a></dt>
          <dd>Der Kern stimmt für bestimmte Regionen: 33 Planungsbereiche gelten offiziell als unterversorgt, weitere 152 sind gefährdet – überwiegend im ländlichen Raum und vor allem bei Hausärzten. Deutschlandweit ist die absolute Ärztezahl aber mit 189.551 niedergelassenen Ärztinnen und Ärzten 2024 ein Rekordhoch. Das Problem ist die ungleiche Verteilung: Zwischen dem am besten und am schlechtesten versorgten Landkreis liegt ein Faktor 4 bei der Ärztedichte.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/medikamente-zu-teuer/">Medikamente in Deutschland sind viel zu teuer</a></dt>
          <dd>Das stimmt für patentgeschützte Neueinführungen – hier sind die Preise im ersten Jahr ohne Deckelung frei wählbar. AMNOG regelt danach einen Rabatt, hat aber den Ausgabenanstieg nicht gestoppt: 59,3 Mrd. € GKV-Arzneimittelausgaben 2024 (+9 %). 54 % der Kosten entfallen auf 7 % der Verordnungen. Im Patentmarkt hat sich der Durchschnittspreis pro Packung von 4.100 € (2015) auf 7.700 € (2024) fast verdoppelt. Das Gegenargument der Industrie – hohe Preise seien nötig, um Forschungs- und Entwicklungskosten zu finanzieren – ist nicht grundsätzlich falsch, erklärt aber nicht alle Preisunterschiede zwischen Ländern.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/digitalisierung-rueckstand/">Deutschland ist beim digitalen Gesundheitssystem hoffnungslos rückständig</a></dt>
          <dd>Der Rückstand war real: Die ePA startete mehrfach verzögert. Seit Februar 2025 haben 73 Millionen Versicherte automatisch eine ePA (Opt-out). Das ist ein echter Systemwechsel, wenn auch spät. Bei digitalen Gesundheitsanwendungen (DiGA) ist Deutschland mit 59 zugelassenen Apps und schnellen Erstattungswegen internationaler Vorreiter – allerdings bei unklarem Kosten-Nutzen-Verhältnis. Fortschritt und Rückstand existieren gleichzeitig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/gkv-pleite/">Die GKV ist bald pleite / Das System ist nicht mehr finanzierbar</a></dt>
          <dd>Die Sorge ist nachvollziehbar: 2024 verzeichnete die GKV ein Defizit von 6,2 Mrd. Euro – das stärkste Ausgabenwachstum seit 30 Jahren. Die Finanzreserven fielen unter die gesetzlich vorgeschriebene Mindestschwelle. Ohne Reformen drohen ab 2027 zweistellige Milliarden-Lücken jährlich. 'Pleite' ist aber nicht das Szenario: Die GKV ist eine Pflichtversicherung mit Beitragsanpassungsmechanismus. Das strukturelle Problem liegt beim Ausgabenwachstum, das schneller steigt als die Einnahmen – vor allem durch steigende Arzneimittelpreise und die alternde Bevölkerung.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gendern/">Gendern: Argumente, Umfragen &amp; Sprachforschung — Faktencheck</a></h3>
      <p>Lehnt die Mehrheit Gendern ab? Macht es Texte unlesbar? 10 Streitpunkte mit Daten aus Allensbach und Sprachforschung — belegt und nachprüfbar.</p>
      <p>8 Fakten · 10 Argumente</p>
      <details>
        <summary>Argumente (10)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-zerstoert-sprache/">Das Gendern zerstört die deutsche Sprache!</a></dt>
          <dd>Die Sorge um die Sprachqualität ist nachvollziehbar — tatsächlich kritisiert auch der Rechtschreibrat die grammatischen Folgeprobleme von Sonderzeichen. Allerdings war die deutsche Sprache immer im Wandel: 1972 wurde ‚Fräulein' in Behörden abgeschafft, seit 1980 sind geschlechtsneutrale Stellenanzeigen Pflicht. Die Beidnennung ist seit Jahrzehnten etabliert und wird von 69 % akzeptiert. Die Debatte betrifft primär neuere Kurzformen wie den Genderstern — nicht geschlechtergerechte Sprache insgesamt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/mehrheit-lehnt-ab/">Eine Mehrheit lehnt Gendern ab!</a></dt>
          <dd>Das stimmt für Gendern mit Sonderzeichen: Laut Forsa (2023) stört es 73 % der Bevölkerung. Allerdings ist das Bild differenzierter: Unter den 18- bis 29-Jährigen befürworten 42 % den Genderstern, und die Doppelnennung wird von 69 % akzeptiert (Infratest dimap/WDR 2022). Die Ablehnung richtet sich vor allem gegen Sonderzeichen im Wortinnern — nicht gegen geschlechtergerechte Sprache an sich. Zudem sprechen sich 46 % gegen ein Genderverbot in Verwaltungstexten aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/nur-modeerscheinung/">Gendern ist nur eine Modeerscheinung!</a></dt>
          <dd>Der Eindruck ist verständlich, weil Sonderzeichen wie der Genderstern erst seit wenigen Jahren verbreitet sind. Geschlechtergerechte Sprache wird jedoch seit den späten 1970ern wissenschaftlich diskutiert — Senta Trömel-Plötz veröffentlichte 1978 den ersten Aufsatz dazu. Seit 1980 sind geschlechtsneutrale Stellenausschreibungen gesetzlich vorgeschrieben, seit 1986 formuliert Hessen Gesetze ohne generisches Maskulinum. Die konkrete Form ändert sich, aber das Grundanliegen besteht seit über 45 Jahren.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/sprache-aendert-nichts/">Sprache ändert doch nichts an der Realität!</a></dt>
          <dd>Die Intuition ist nachvollziehbar — aber die Forschung zeigt messbare Effekte. Eine Multi-Lab-Studie mit 2.697 Teilnehmenden an 12 Laboren (Brohmer et al. 2024) bestätigte: Bei geschlechterinklusiven Formen nennen Versuchspersonen signifikant mehr Frauen. Kinder trauen sich bei Beidnennung typisch männliche Berufe eher zu (Vervecken &amp; Hannover 2015). Allerdings sind die meisten Befunde Laborergebnisse — ob und wie stark sie sich im Alltag auswirken, ist wissenschaftlich nicht abschließend geklärt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/generisches-maskulinum-reicht/">Das generische Maskulinum meint doch alle!</a></dt>
          <dd>Grammatisch ist das korrekt — das generische Maskulinum soll per Konvention alle Geschlechter umfassen. Die Sprachpsychologie zeigt jedoch, dass es nicht von allen so wahrgenommen wird: In Studien denken Versuchspersonen beim generischen Maskulinum überwiegend an Männer. Die Uni Würzburg (Rothermund &amp; Strack 2024) fand, dass selbst ein expliziter Hinweis auf die geschlechtsübergreifende Bedeutung den Male Bias nicht beseitigt. Das generische Maskulinum funktioniert grammatisch, aber nicht immer kognitiv.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-unlesbar/">Gendern macht Texte unlesbar!</a></dt>
          <dd>Die subjektive Wahrnehmung ist verbreitet, wird aber von der Verständlichkeitsforschung nicht gestützt. Die TU Braunschweig (Friedrich &amp; Heise 2019) testete vier Versionen eines Vertrags an 355 Personen: kein messbarer Verständlichkeitsunterschied. Blake &amp; Klimmt (2010) fanden auch bei Nachrichtentexten keine Beeinträchtigung. Allerdings gibt es berechtigte Barrierefreiheitsbedenken: Der DBSV rät von Doppelpunkt und Unterstrich ab, da Screenreader sie problematisch verarbeiten. Die Verständlichkeit hängt weniger am Gendern als an der gewählten Form.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/uni-genderzwang/">An den Unis wird man zum Gendern gezwungen!</a></dt>
          <dd>Mindestens 50 deutsche Hochschulen haben Sprachleitfäden — diese sind allerdings Empfehlungen, keine Vorschriften. Der Rechtschreibrat hat 2023 darauf hingewiesen, dass es strittig sei, ob Hochschulen vom amtlichen Regelwerk abweichen dürfen. In Bayern gilt seit April 2024 ein Genderverbot auch an Hochschulen, mit Ausnahme der geschützten Freiheit von Forschung und Lehre. Es gibt also Empfehlungen, selten echten Druck, und zunehmend auch explizite Verbote.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gegen-rechtschreibung/">Gendern ist gegen die Regeln der deutschen Rechtschreibung!</a></dt>
