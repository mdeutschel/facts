          <dt><a href="https://fakten-stammtisch.de/thema/bildung/homeschooling-freiheit/">Homeschooling gibt Eltern endlich Freiheit – Schulpflicht ist überholt.</a></dt>
          <dd>Elternrechte sind wichtig. Gleichzeitig soll die Schulpflicht gleiche Bildungschancen, soziale Teilhabe und Kinderschutz sichern – gerade auch für Kinder, die zuhause wenig Unterstützung haben. Deshalb ist Homeschooling in Deutschland nur in engen Ausnahmefällen möglich. Mehr Elternmitwirkung in Schule ist sinnvoll, ein genereller Ersatz der Schulpflicht aber nicht.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/gymnasium-25-prozent/">Nur die besten 25 Prozent sollten aufs Gymnasium.</a></dt>
          <dd>Leistungsorientierung ist legitim, aber starre Quoten sind bildungspolitisch riskant. Lernverläufe entwickeln sich unterschiedlich, und frühe harte Selektion verschärft oft die Abhängigkeit vom Elternhaus. Sinnvoller sind klare Standards, gute Diagnostik und durchlässige Bildungswege, damit Spätentwickler nicht dauerhaft aussortiert werden.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/bildung/schule-ideologiefrei/">Schule muss endlich ideologiefrei werden.</a></dt>
          <dd>Schule darf keine Parteipropaganda machen – da stimmt der Kern. ‚Ideologiefrei‘ heißt aber nicht wertfrei: Demokratie, Grundrechte, Gleichberechtigung, Nationalsozialismus, Diskriminierung und Medienkompetenz gehören zum Bildungsauftrag. Entscheidend ist, Themen plural und altersgerecht zu behandeln statt parteipolitisch zu rahmen.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gesundheit/">Gesundheitssystem Deutschland: Kosten, Pflege, Argumente</a></h3>
      <p>Bestes System der Welt? Bald pleite? Antworten zu Beitragssatz, Zwei-Klassen-Medizin, Pflegenotstand und ePA mit Quellen aus GKV-SV, BMG und OECD.</p>
      <p>10 Fakten · 12 Argumente</p>
      <details>
        <summary>Argumente (12)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/bestes-system/">Wir haben das beste Gesundheitssystem der Welt</a></dt>
          <dd>Deutschland hat echte Stärken: universelle Absicherung, kurze Wartezeiten für Notfallversorgung und schnellen Zugang zu neuen Medikamenten. Gleichzeitig belegen Daten erhebliche Zugangsunterschiede zwischen GKV und PKV, einen akuten Pflegenotstand, strukturelle Überkapazitäten im Krankenhausbereich und einen der niedrigsten Präventionsanteile im OECD-Vergleich. 'Bestes System der Welt' ist daher eine pauschale Übertreibung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/beitraege-hoch/">Die Krankenkassenbeiträge sind viel zu hoch</a></dt>
          <dd>Der GKV-Gesamtbeitrag liegt 2026 bei 17,5 % des Bruttogehalts und wird paritätisch geteilt, d. h. der Arbeitnehmer-Anteil beträgt ca. 8,75 %. Zum Vergleich: In Frankreich liegt der Arbeitnehmer-Anteil bei rund 7 %, in den Niederlanden bei ca. 5,5 % – der deutsche Wert ist also hoch, aber kein extremer Ausreißer im OECD-Vergleich. Das eigentliche Problem ist weniger die Höhe als die Effizienz: Deutschland gibt sehr viel aus, hat strukturelle Überkapazitäten im Krankenhausbereich und investiert vergleichsweise wenig in Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/jeder-versorgt/">Jeder bekommt in Deutschland die medizinische Versorgung, die er braucht</a></dt>
          <dd>Formal ist der Zugang breit, aber in der Praxis gibt es spürbare Versorgungslücken. Viele gesetzlich Versicherte berichten über lange Wartezeiten auf Facharzttermine, hinzu kommen Engpässe in Pflege und psychischer Versorgung sowie regionale Unterschiede.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/auslaender-gesundheit/">Ausländer belasten unser Gesundheitssystem</a></dt>
          <dd>Es kommt auf die Gruppe an: Erwerbsmigrant:innen sowie EU-Bürger:innen zahlen Beiträge wie alle anderen GKV-Mitglieder auch – und nehmen statistisch im Schnitt weniger Leistungen in Anspruch als die ältere inländische Bevölkerung, weil sie jünger und erwerbstätig sind. Für Asylsuchende gilt zunächst nur ein eingeschränkter Leistungsumfang (AsylbLG: akute Erkrankungen, Schmerzen, Schwangerschaft, Impfungen); erst nach 36 Monaten ist der Leistungsumfang deutlich erweitert. Die Haupttreiber der Finanzierungsprobleme sind strukturell: steigende Ausgaben durch die alternde Bevölkerung, Überkapazitäten im Krankenhausbereich und zu wenig Prävention.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/psychisch-einbildung/">Psychische Krankheiten sind nur Einbildung / Modeerscheinung</a></dt>
          <dd>Psychische Erkrankungen sind medizinisch genauso real wie körperliche – das ist wissenschaftlicher Konsens. Ein Teil des statistischen Anstiegs erklärt sich durch breiteres Bewusstsein und erweiterte Diagnosekriterien; die zugrundeliegenden Erkrankungen sind dadurch aber nicht weniger behandlungsbedürftig. Im ersten Halbjahr 2025 stiegen die Fallzahlen in Psychotherapie und Psychiatrie weiter um 3,4 %, in der Kinder- und Jugendpsychiatrie sogar um 5,7 %. Die Versorgung hinkt dem Bedarf seit Jahren hinterher.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/homoeopathie/">Homöopathie/Alternativmedizin sollte von der Kasse bezahlt werden</a></dt>
          <dd>Für Homöopathie gibt es keine robuste, reproduzierbare Evidenz eines Nutzens über Placebo hinaus. Der Gesetzgeber hat 2023 mit dem GKV-Finanzstabilisierungsgesetz die Möglichkeit der Krankenkassen gestrichen, Homöopathie als freiwillige Satzungsleistung zu erstatten – begründet mit dem fehlenden Nachweis des Nutzens. In einem System mit konkreten Engpässen bei Pflege, Psychotherapie und Prävention ist die Mittelverwendung nach Evidenz ein nachvollziehbares Prinzip.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/zu-viele-krankenhaeuser/">Es gibt zu viele Krankenhäuser</a></dt>
          <dd>Da ist tatsächlich etwas dran: Deutschland hat viele Krankenhausbetten und eine vergleichsweise niedrige Bettenauslastung. Aber 'weniger' heißt nicht automatisch 'besser'. Es braucht Spezialisierung, Vernetzung und gleichzeitig Erreichbarkeit – besonders in ländlichen Regionen. Genau diesen Spagat versucht die Krankenhausreform.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/pharma/">Die Pharmaindustrie macht uns absichtlich krank</a></dt>
          <dd>Arzneimittel unterliegen in der EU einem regulierten Zulassungs- und Bewertungsverfahren. Berechtigte Kritik betrifft eher Preise, Transparenz und Fehlanreize als eine belegte Absicht, Menschen krank zu machen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/aerztemangel-landleben/">Auf dem Land gibt es keine Ärzte mehr</a></dt>
          <dd>Der Kern stimmt für bestimmte Regionen: 33 Planungsbereiche gelten offiziell als unterversorgt, weitere 152 sind gefährdet – überwiegend im ländlichen Raum und vor allem bei Hausärzten. Deutschlandweit ist die absolute Ärztezahl aber mit 189.551 niedergelassenen Ärztinnen und Ärzten 2024 ein Rekordhoch. Das Problem ist die ungleiche Verteilung: Zwischen dem am besten und am schlechtesten versorgten Landkreis liegt ein Faktor 4 bei der Ärztedichte.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/medikamente-zu-teuer/">Medikamente in Deutschland sind viel zu teuer</a></dt>
          <dd>Das stimmt für patentgeschützte Neueinführungen – hier sind die Preise im ersten Jahr ohne Deckelung frei wählbar. AMNOG regelt danach einen Rabatt, hat aber den Ausgabenanstieg nicht gestoppt: 59,3 Mrd. € GKV-Arzneimittelausgaben 2024 (+9 %). 54 % der Kosten entfallen auf 7 % der Verordnungen. Im Patentmarkt hat sich der Durchschnittspreis pro Packung von 4.100 € (2015) auf 7.700 € (2024) fast verdoppelt. Das Gegenargument der Industrie – hohe Preise seien nötig, um Forschungs- und Entwicklungskosten zu finanzieren – ist nicht grundsätzlich falsch, erklärt aber nicht alle Preisunterschiede zwischen Ländern.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/digitalisierung-rueckstand/">Deutschland ist beim digitalen Gesundheitssystem hoffnungslos rückständig</a></dt>
          <dd>Der Rückstand war real: Die ePA startete mehrfach verzögert. Seit Februar 2025 haben 73 Millionen Versicherte automatisch eine ePA (Opt-out). Das ist ein echter Systemwechsel, wenn auch spät. Bei digitalen Gesundheitsanwendungen (DiGA) ist Deutschland mit 59 zugelassenen Apps und schnellen Erstattungswegen internationaler Vorreiter – allerdings bei unklarem Kosten-Nutzen-Verhältnis. Fortschritt und Rückstand existieren gleichzeitig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gesundheit/gkv-pleite/">Die GKV ist bald pleite / Das System ist nicht mehr finanzierbar</a></dt>
          <dd>Die Sorge ist nachvollziehbar: 2024 verzeichnete die GKV ein Defizit von 6,2 Mrd. Euro – das stärkste Ausgabenwachstum seit 30 Jahren. Die Finanzreserven fielen unter die gesetzlich vorgeschriebene Mindestschwelle. Ohne Reformen drohen ab 2027 zweistellige Milliarden-Lücken jährlich. 'Pleite' ist aber nicht das Szenario: Die GKV ist eine Pflichtversicherung mit Beitragsanpassungsmechanismus. Das strukturelle Problem liegt beim Ausgabenwachstum, das schneller steigt als die Einnahmen – vor allem durch steigende Arzneimittelpreise und die alternde Bevölkerung.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/gendern/">Gendern: Argumente, Umfragen &amp; Sprachforschung — Faktencheck</a></h3>
      <p>Lehnt die Mehrheit Gendern ab? Macht es Texte unlesbar? 10 Streitpunkte mit Daten aus Allensbach und Sprachforschung — belegt und nachprüfbar.</p>
      <p>8 Fakten · 10 Argumente</p>
      <details>
        <summary>Argumente (10)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-zerstoert-sprache/">Das Gendern zerstört die deutsche Sprache!</a></dt>
          <dd>Die Sorge um die Sprachqualität ist nachvollziehbar — tatsächlich kritisiert auch der Rechtschreibrat die grammatischen Folgeprobleme von Sonderzeichen. Allerdings war die deutsche Sprache immer im Wandel: 1972 wurde ‚Fräulein' in Behörden abgeschafft, seit 1980 sind geschlechtsneutrale Stellenanzeigen Pflicht. Die Beidnennung ist seit Jahrzehnten etabliert und wird von 69 % akzeptiert. Die Debatte betrifft primär neuere Kurzformen wie den Genderstern — nicht geschlechtergerechte Sprache insgesamt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/mehrheit-lehnt-ab/">Eine Mehrheit lehnt Gendern ab!</a></dt>
          <dd>Das stimmt für Gendern mit Sonderzeichen: Laut Forsa (2023) stört es 73 % der Bevölkerung. Allerdings ist das Bild differenzierter: Unter den 18- bis 29-Jährigen befürworten 42 % den Genderstern, und die Doppelnennung wird von 69 % akzeptiert (Infratest dimap/WDR 2022). Die Ablehnung richtet sich vor allem gegen Sonderzeichen im Wortinnern — nicht gegen geschlechtergerechte Sprache an sich. Zudem sprechen sich 46 % gegen ein Genderverbot in Verwaltungstexten aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/nur-modeerscheinung/">Gendern ist nur eine Modeerscheinung!</a></dt>
          <dd>Der Eindruck ist verständlich, weil Sonderzeichen wie der Genderstern erst seit wenigen Jahren verbreitet sind. Geschlechtergerechte Sprache wird jedoch seit den späten 1970ern wissenschaftlich diskutiert — Senta Trömel-Plötz veröffentlichte 1978 den ersten Aufsatz dazu. Seit 1980 sind geschlechtsneutrale Stellenausschreibungen gesetzlich vorgeschrieben, seit 1986 formuliert Hessen Gesetze ohne generisches Maskulinum. Die konkrete Form ändert sich, aber das Grundanliegen besteht seit über 45 Jahren.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/sprache-aendert-nichts/">Sprache ändert doch nichts an der Realität!</a></dt>
          <dd>Die Intuition ist nachvollziehbar — aber die Forschung zeigt messbare Effekte. Eine Multi-Lab-Studie mit 2.697 Teilnehmenden an 12 Laboren (Brohmer et al. 2024) bestätigte: Bei geschlechterinklusiven Formen nennen Versuchspersonen signifikant mehr Frauen. Kinder trauen sich bei Beidnennung typisch männliche Berufe eher zu (Vervecken &amp; Hannover 2015). Allerdings sind die meisten Befunde Laborergebnisse — ob und wie stark sie sich im Alltag auswirken, ist wissenschaftlich nicht abschließend geklärt.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/generisches-maskulinum-reicht/">Das generische Maskulinum meint doch alle!</a></dt>
          <dd>Grammatisch ist das korrekt — das generische Maskulinum soll per Konvention alle Geschlechter umfassen. Die Sprachpsychologie zeigt jedoch, dass es nicht von allen so wahrgenommen wird: In Studien denken Versuchspersonen beim generischen Maskulinum überwiegend an Männer. Die Uni Würzburg (Rothermund &amp; Strack 2024) fand, dass selbst ein expliziter Hinweis auf die geschlechtsübergreifende Bedeutung den Male Bias nicht beseitigt. Das generische Maskulinum funktioniert grammatisch, aber nicht immer kognitiv.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gendern-unlesbar/">Gendern macht Texte unlesbar!</a></dt>
          <dd>Die subjektive Wahrnehmung ist verbreitet, wird aber von der Verständlichkeitsforschung nicht gestützt. Die TU Braunschweig (Friedrich &amp; Heise 2019) testete vier Versionen eines Vertrags an 355 Personen: kein messbarer Verständlichkeitsunterschied. Blake &amp; Klimmt (2010) fanden auch bei Nachrichtentexten keine Beeinträchtigung. Allerdings gibt es berechtigte Barrierefreiheitsbedenken: Der DBSV rät von Doppelpunkt und Unterstrich ab, da Screenreader sie problematisch verarbeiten. Die Verständlichkeit hängt weniger am Gendern als an der gewählten Form.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/uni-genderzwang/">An den Unis wird man zum Gendern gezwungen!</a></dt>
          <dd>Mindestens 50 deutsche Hochschulen haben Sprachleitfäden — diese sind allerdings Empfehlungen, keine Vorschriften. Der Rechtschreibrat hat 2023 darauf hingewiesen, dass es strittig sei, ob Hochschulen vom amtlichen Regelwerk abweichen dürfen. In Bayern gilt seit April 2024 ein Genderverbot auch an Hochschulen, mit Ausnahme der geschützten Freiheit von Forschung und Lehre. Es gibt also Empfehlungen, selten echten Druck, und zunehmend auch explizite Verbote.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/gegen-rechtschreibung/">Gendern ist gegen die Regeln der deutschen Rechtschreibung!</a></dt>
          <dd>Für Sonderzeichen wie Genderstern und Doppelpunkt trifft das im Kern zu: Der Rat für deutsche Rechtschreibung hat 2023 festgestellt, dass sie ‚nicht zum Kernbestand der deutschen Orthografie' gehören. Das gilt allerdings nicht für alle Formen — die Beidnennung und geschlechtsneutrale Formulierungen sind vollständig regelkonform. Der Rechtschreibrat beobachtet die Entwicklung bewusst weiter und schließt eine spätere Aufnahme nicht aus — er sieht sie aber ‚derzeit nicht wissenschaftlich eindeutig zu begründen'.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/andere-sprachen-ohne/">Andere Sprachen kommen auch ohne Gendern aus!</a></dt>
          <dd>Das trifft auf manche Sprachen zu — Finnisch und Türkisch etwa kennen kein grammatisches Geschlecht. Allerdings zeigen Studien, dass selbst dort ein Male Bias bei geschlechtsneutralen Pronomen besteht. Und in vielen Sprachen mit Genussystem gibt es parallele Debatten: In Frankreich hat der Senat écriture inclusive 2023 mit 221:82 verboten, in Schweden wurde ‚hen' 2015 offiziell eingeführt, im Englischen ist das singuläre ‚they' seit 2019 im Merriam-Webster. Das Anliegen ist international — die Lösungen fallen je nach Sprachstruktur verschieden aus.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/gendern/sprachpolizei/">Gendern ist Sprachpolizei und Bevormundung!</a></dt>
          <dd>Die Sorge vor Sprachkontrolle ist demokratisch berechtigt. Tatsächlich gibt es weder ein Bundesgesetz noch eine Pflicht zum Gendern — 75 % lehnen eine solche laut Forsa auch ab. Umgekehrt haben mehrere Bundesländer Gendern in Schulen und Verwaltung verboten — also eher ein Sprechverbot als ein Sprechgebot. Kommunale Leitfäden wie in Hannover oder Bremen sind Empfehlungen, keine Vorschriften. Die Lage ist paradox: Es wird sowohl ein angeblicher Genderzwang als auch ein tatsächliches Genderverbot kritisiert.</dd>
        </dl>
      </details>
      <h3><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/">KI &amp; Arbeitsmarkt: Welche Jobs sind in Gefahr? Fakten 2026</a></h3>
      <p>Vernichtet KI die Hälfte aller Jobs? Verschläft Deutschland die Revolution? Antworten zu Automatisierung, Berufen und Weiterbildung — Quellen IAB, OECD.</p>
      <p>8 Fakten · 9 Argumente</p>
      <details>
        <summary>Argumente (9)</summary>
        <dl>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/ki-vernichtet-jobs/">KI wird die Hälfte aller Jobs vernichten!</a></dt>
          <dd>Die Angst ist verständlich, aber die Forschung zeichnet ein anderes Bild. Laut IAB fällt der Nettoeffekt von KI auf die Gesamtbeschäftigung in Deutschland nahezu neutral aus — es werden etwa so viele Arbeitsplätze geschaffen wie abgebaut. Allerdings müssen bis zu 3 Millionen Menschen den Beruf wechseln. Das Problem ist weniger Massenarbeitslosigkeit als ein massiver Umschulungsbedarf.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/bueroarbeit-ueberfluessig/">In ein paar Jahren braucht man keine Bürojobs mehr!</a></dt>
          <dd>Büro- und Verwaltungstätigkeiten sind tatsächlich am stärksten betroffen — 54 % der geschätzten Jobwechsel entfallen auf diesen Bereich. Aber ‚betroffen' heißt nicht ‚überflüssig': BCG-Berater mit KI-Zugang lieferten 40 % bessere Qualität, was zeigt, dass KI eher ein Werkzeug als ein Ersatz ist. Die Aufgabenprofile werden sich verändern, die Funktionen bleiben.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/deutschland-verschlaeft/">Deutschland verschläft die KI-Revolution!</a></dt>
          <dd>Das Bild ist differenzierter: Deutschland liegt auf Platz 7 im globalen KI-Index, hält Platz 5 bei KI-Patenten und hat 935 aktive KI-Startups. Die echte Schwäche liegt im Risikokapital (12-mal weniger pro Kopf als die USA) und der langsamen KI-Adoption in traditionellen Industrien. Deutschland hat die Forschung, aber nicht die Skalierung.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/nur-einfache-taetigkeiten/">KI betrifft nur einfache Tätigkeiten!</a></dt>
          <dd>Das Gegenteil ist der Fall: Die stärkste Zunahme der Automatisierbarkeit zeigt sich bei Expertenberufen (+9,7 Prozentpunkte). Betriebswirte, Softwareentwickler und Journalisten erleben Sprünge von 20 bis 30 Prozentpunkten. Der absolute Wert bleibt bei Fachkraftberufen am höchsten (62 %), aber der Trend zeigt klar: Generative KI trifft zunehmend die Wissensarbeit.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/nur-produktiver/">KI macht nur produktiver, niemand verliert seinen Job!</a></dt>
          <dd>Produktivitätsgewinne sind real — bis zu 14 % im Kundenservice, 40 % bessere Qualität in der Beratung. Aber 27 % der deutschen Unternehmen erwarten in den nächsten fünf Jahren Stellenabbau durch KI, und das IAB rechnet mit 1,6 Millionen umgeschichteten Arbeitsplätzen. Produktivität und Jobabbau schließen sich nicht gegenseitig aus — sie passieren gleichzeitig.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/politik-tut-nichts/">Die Politik tut nichts für Weiterbildung!</a></dt>
          <dd>Es gibt durchaus Programme: das Qualifizierungschancengesetz, die Nationale Weiterbildungsstrategie, über 5 Milliarden Euro für die KI-Strategie. Das Problem ist die Reichweite: Nur 20 % der Beschäftigten erhalten KI-Schulungen, Hilfsarbeitskräfte haben eine 9,5-mal niedrigere Weiterbildungsquote als Akademiker. Die Instrumente existieren — sie erreichen aber systematisch die Falschen.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/kreative-arbeit-weg/">KI nimmt den Kreativen die Arbeit weg!</a></dt>
          <dd>Kreativberufe sind tatsächlich stark betroffen: Modedesigner (+38 PP), Journalisten (+20 PP), Komponisten erstmals automatisierbar (von 0 auf 25 %). Der Synchronsprecher ist der einzige Beruf mit 100 % Substituierbarkeit. Aber in der Breite zeigt sich eher eine Verschiebung hin zur Mensch-KI-Kollaboration als eine vollständige Ersetzung — kreative Gesamtkonzepte sind bisher kaum automatisierbar.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/china-usa-voraus/">China und die USA sind uns bei KI meilenweit voraus!</a></dt>
          <dd>Bei Investitionen stimmt das: Die USA investieren mit 109 Milliarden Dollar 55-mal mehr als Deutschland. Bei Patenten dominiert China mit 25.177 gegenüber 436. Aber Deutschland ist Europas Nr. 1 bei KI-Patenten, hat eine wachsende Startup-Szene (+36 %) und weltweit anerkannte Forschung. Die Lücke liegt weniger in der Kompetenz als in der Skalierung und im Risikokapital.</dd>
          <dt><a href="https://fakten-stammtisch.de/thema/ki-arbeitsmarkt/grundeinkommen-noetig/">Wir brauchen wegen KI ein bedingungsloses Grundeinkommen!</a></dt>
          <dd>Die Debatte ist legitim, aber die aktuelle Forschungslage stützt sie nicht unmittelbar: Das IAB erwartet keinen Netto-Jobabbau, und historisch haben technologische Umbrüche Arbeit transformiert statt eliminiert. Der dringendere Bedarf liegt bei gezielter Qualifizierung und sozialer Absicherung während des Übergangs. Ob KI langfristig ein Grundeinkommen nötig macht, hängt von Geschwindigkeit und Tiefe des Wandels ab — das ist heute noch offen.</dd>
        </dl>
      </details>
      <h2>So nutzt du Fakten-Stammtisch effektiv</h2>
      <p>Jede Themenseite folgt demselben Aufbau: zuerst die typische Stammtisch-Behauptung, dann die kompakte, quellenbasierte Antwort. Damit kannst du in einer Diskussion direkt reagieren, ohne zwischen Tabs zu suchen. Wer tiefer einsteigen will, findet darunter den vollständigen Faktenteil mit Zahlen, Einordnungen und Quellen — du entscheidest, ob die kurze Replik reicht oder das ganze Thema dran ist.</p>
      <p>Die Inhalte sind bewusst auf Deutschland zugeschnitten und in klarer Alltagssprache formuliert. Es geht nicht um parteipolitische Parolen, sondern um belastbare Information, die du in echten Gesprächen sauber verwenden kannst. Zu jeder Aussage gibt es verlinkte Quellen — von amtlichen Statistiken über Studien bis zu Behördenangaben — damit du jede Zahl bei Rückfragen nachvollziehen und belegen kannst.</p>
      <p>In der Praxis heißt das: kein Studienberg im Kopf nötig. Suche das Thema über die Suchleiste, lies die zugespitzte Antwort, springe bei Bedarf in den Fakten-Tab. So bleibst du sachlich, kannst Behauptungen einordnen und bist auf wiederkehrende Stammtisch-Sprüche vorbereitet.</p>
      <h2>Was hinter Fakten-Stammtisch steht</h2>
      <p>Fakten-Stammtisch ist ein privates, nicht-kommerzielles Projekt von Marcel Deutschel — kein Faktencheck-Portal im journalistischen Sinn, kein Wikipedia-Ersatz, kein Werbe- oder Affiliate-Angebot. Hintergrund, Motivation, Verantwortung und Grenzen des Projekts sind ausführlich auf der <a href="https://fakten-stammtisch.de/ueber/">Über-Seite</a> beschrieben.</p>
      <h2>Wie die Inhalte geprüft werden</h2>
      <p>Jedes Topic durchläuft denselben Prüfprozess: Recherche, strukturierte Aufbereitung, automatisierte Quellenverifizierung und inhaltliche Prüfung gegen acht Qualitätsdimensionen — von Nuance über Claim-Source-Fit bis zur Gesprächstauglichkeit der Argumente. Den vollständigen Workflow, das Bewertungsschema für einzelne Behauptungen und die Grenzen der Methodik beschreibt die <a href="https://fakten-stammtisch.de/methodik/">Methodik-Seite</a>. Praktische Tipps für die Gesprächssituation: <a href="https://fakten-stammtisch.de/leitfaden/">Gesprächsleitfaden</a>.</p>
      <h2>Wie die Inhalte hier entstehen</h2>
      <p>Zu jeder Zahl gehört eine verlinkte Primärquelle. Jedes Argument durchläuft einen automatisierten Prüfprozess für Quellenverifizierung und argumentative Qualität — die Skripte dafür liegen offen im Repository. Korrekturen zu falschen Zahlen, kaputten Quellen-Links oder schiefen Argumentationen sind über Feedback und GitHub-Issues möglich und erwünscht. Die Erstellung der Inhalte erfolgt mit Sprachmodellen; Verantwortung für Veröffentlichung und Methodik trägt der Betreiber. Eine redaktionelle Vollprüfung jeder einzelnen Aussage findet bewusst nicht statt — die Qualität soll vom Workflow getragen werden, nicht von einem einzelnen Lektorat.</p>
      <h2>Quellen &amp; Transparenz</h2>
      <p>Alle Aussagen auf dieser Seite werden mit Primärquellen belegt (Studien, amtliche Statistiken, Fachinstitute). Die vollständige Quellenliste ist auf jeder Themenseite einsehbar.</p>
